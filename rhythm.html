<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ナビちゃん リズムたたき</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:linear-gradient(180deg,#ffe9f6 0%,#ffd6ea 55%,#ffc2dd 100%);
    color:#5a2d16; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  /* 上部バー（たこなぐりと同じ並び） */
  #topbar{ position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:flex-start; gap:8px; padding:10px; pointer-events:none; }
  .tbtn{ pointer-events:auto; cursor:pointer; font-family:inherit; font-size:19px; font-weight:bold; color:#7a3410;
    background:#fff8f0; border:3px solid #d97b3f; border-radius:999px; padding:10px 18px; box-shadow:0 3px 0 rgba(140,70,20,.35); }
  .tbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(140,70,20,.35); }
  #counter{ margin:0 auto; background:rgba(255,252,240,.96); border:4px solid #e88bb0; border-radius:999px;
    padding:8px 30px; font-size:clamp(24px,4.6vw,38px); font-weight:bold; color:#a03d63; box-shadow:0 4px 0 rgba(150,60,90,.3); white-space:nowrap; }

  /* リズムゲージ */
  #gaugeWrap{ position:fixed; top:96px; left:50%; transform:translateX(-50%); z-index:25; width:min(88vw,620px); text-align:center; }
  #gaugeLabel{ font-size:clamp(19px,3.2vw,25px); font-weight:bold; color:#8a3b12; text-shadow:0 2px 0 rgba(255,255,255,.6); margin-bottom:4px; }
  #gaugeOuter{ height:30px; background:rgba(255,255,255,.75); border:4px solid #b85c1e; border-radius:999px; overflow:hidden; box-shadow:0 3px 0 rgba(140,70,20,.3); }
  #gaugeFill{ height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,#ffb03a,#ff7038,#f22e2e); transition:width .35s ease; }

  /* レーン */
  #laneWrap{ position:fixed; left:0; right:0; top:50%; transform:translateY(-50%); z-index:10; height:clamp(150px,30vh,220px); pointer-events:none; }
  #lane{ position:absolute; left:2vw; right:2vw; top:50%; height:64px; transform:translateY(-50%);
    background:rgba(255,255,255,.55); border:4px dashed #e88bb0; border-radius:32px; }
  #laneArrow{ position:absolute; left:2vw; right:2vw; top:50%; transform:translateY(-50%); text-align:center;
    font-size:clamp(20px,3.4vw,28px); font-weight:bold; color:#c98aa8; letter-spacing:.2em; }
  #hitZone{ position:absolute; right:calc(2vw + 9%); top:50%; transform:translate(50%,-50%); z-index:3;
    width:clamp(110px,17vw,170px); height:clamp(110px,17vw,170px); border-radius:50%;
    border:5px solid #f22e2e; background:rgba(255,210,58,.35); box-shadow:0 0 0 6px rgba(255,255,255,.6), 0 0 26px rgba(242,46,46,.45); }
  #hitZone span{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:clamp(18px,3vw,26px); font-weight:bold; color:#d43a12; }
  .note{ position:absolute; top:50%; transform:translate(-50%,-50%); z-index:5; pointer-events:auto; cursor:pointer;
    font-size:clamp(64px,12vmin,96px); line-height:1; filter:drop-shadow(0 4px 4px rgba(90,40,0,.35)); }
  .note.gold{ filter:drop-shadow(0 0 16px gold) drop-shadow(0 4px 4px rgba(90,40,0,.35)); }
  .note.hit{ animation:notePop .25s ease-out forwards; }
  @keyframes notePop{ 0%{ transform:translate(-50%,-50%) scale(1);} 40%{ transform:translate(-50%,-50%) scale(1.35) rotate(12deg);} 100%{ transform:translate(-50%,-50%) scale(0); opacity:0; } }
  .judge{ position:absolute; z-index:6; pointer-events:none; font-weight:bold; color:#e0331f;
    font-size:clamp(28px,5.4vw,44px); text-shadow:0 2px 0 #fff, 0 0 12px #ffd23a; white-space:nowrap;
    animation:judgeUp .7s ease-out forwards; }
  @keyframes judgeUp{ 0%{ opacity:0; transform:translate(-50%,0) scale(.6);} 30%{ opacity:1; transform:translate(-50%,-14px) scale(1.15);} 100%{ opacity:0; transform:translate(-50%,-46px) scale(1);} }

  /* ナビちゃん（右端・ハンマー持ち） */
  #navi{ position:fixed; right:calc(2vw + 9%); top:50%; z-index:20; transform:translate(50%,-50%);
    width:clamp(120px,20vw,190px); pointer-events:none; text-align:center; }
  #naviImg{ width:100%; display:block; }
  #hammer{ position:absolute; left:-14px; top:-38px; font-size:clamp(56px,10vmin,84px); line-height:1;
    transform-origin:85% 85%; transform:rotate(0deg); }
  #navi.swing #hammer{ animation:swing .3s ease-out; }
  @keyframes swing{ 0%{ transform:rotate(0deg);} 40%{ transform:rotate(-70deg);} 100%{ transform:rotate(0deg);} }
  #naviLabel{ font-size:clamp(18px,3vw,24px); font-weight:bold; color:#8a3b12; text-shadow:0 2px 0 rgba(255,255,255,.7); margin-top:2px; }
  #bubble{ position:fixed; right:calc(2vw + 9% + 90px); top:calc(50% - 190px); z-index:20; max-width:min(52vw,380px);
    background:#fffdf4; border:3px solid #e8a13a; border-radius:16px; padding:10px 14px;
    font-size:clamp(19px,3vw,25px); font-weight:bold; color:#6b4423; line-height:1.5;
    box-shadow:0 4px 10px rgba(120,70,0,.25); opacity:0; transition:opacity .35s ease; pointer-events:none; }
  #bubble.show{ opacity:1; }

  /* 閃光と大文字 */
  #flashFx{ position:fixed; inset:0; z-index:44; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.98) 0%, rgba(255,214,120,.85) 45%, rgba(255,140,60,.35) 75%, transparent 100%); }
  #flashFx.go{ animation:flashGo .7s ease-out; }
  @keyframes flashGo{ 0%{ opacity:0; } 18%{ opacity:1; } 100%{ opacity:0; } }
  #boomText{ position:fixed; inset:0; z-index:47; display:flex; align-items:center; justify-content:center; pointer-events:none;
    font-size:clamp(52px,11vw,110px); font-weight:bold; color:#f22e2e; -webkit-text-stroke:3px #fff;
    text-shadow:0 6px 0 rgba(160,40,0,.35), 0 0 34px #ffd23a; opacity:0; }
  #boomText.go{ animation:boomGo 2.2s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes boomGo{ 0%{ opacity:0; transform:scale(.3) rotate(-6deg);} 18%{ opacity:1; transform:scale(1.15) rotate(2deg);} 30%{ transform:scale(1);} 80%{ opacity:1;} 100%{ opacity:0; transform:scale(1.05);} }

  /* タイトル画面 */
  #title{ position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background:rgba(255,233,246,.88); }
  #title.hide{ display:none; }
  .tcard{ background:#fffdf6; border:6px solid #e88bb0; border-radius:34px; padding:30px 40px; text-align:center;
    box-shadow:0 14px 40px rgba(120,60,0,.35); max-width:min(92vw,560px); animation:cardIn .5s cubic-bezier(.2,1.5,.4,1); }
  @keyframes cardIn{ 0%{ transform:scale(.7); opacity:0;} 100%{ transform:scale(1); opacity:1;} }
  .tcard h2{ font-size:clamp(34px,6.4vw,50px); color:#d43a12; margin-bottom:8px; }
  .tcard p{ font-size:clamp(21px,3.8vw,28px); font-weight:bold; color:#6b4423; line-height:1.7; }
  .tcard .timg{ width:clamp(130px,24vw,190px); margin:6px auto 2px; display:block; }
  #startBtn{ cursor:pointer; font-family:inherit; font-size:clamp(28px,5vw,38px); font-weight:bold; color:#fff;
    background:#ff8c42; border:4px solid #d96a1e; border-radius:999px; padding:16px 44px; margin-top:16px;
    box-shadow:0 5px 0 rgba(160,80,10,.5); }
  #startBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(160,80,10,.5); }

  /* リザルト画面 */
  #result{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(255,244,230,.72); }
  #result.show{ display:flex; }
  .card{ background:#fffdf6; border:6px solid #d97b3f; border-radius:34px; padding:34px 44px; text-align:center;
    box-shadow:0 14px 40px rgba(120,60,0,.35); max-width:min(92vw,560px); animation:cardIn .5s cubic-bezier(.2,1.5,.4,1); }
  .card h2{ font-size:clamp(34px,6.4vw,50px); color:#d43a12; margin-bottom:10px; }
  .card p{ font-size:clamp(22px,4vw,30px); font-weight:bold; color:#6b4423; line-height:1.7; }
  .card .big{ font-size:clamp(40px,8vw,58px); color:#e0331f; }
  .rbtns{ display:flex; gap:14px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  .rbtn{ cursor:pointer; font-family:inherit; font-size:clamp(23px,4vw,30px); font-weight:bold; border-radius:999px; padding:14px 30px; }
  #againBtn{ background:#ff8c42; color:#fff; border:4px solid #d96a1e; box-shadow:0 5px 0 rgba(160,80,10,.5); }
  #againBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(160,80,10,.5); }
  #homeBtn{ background:#f2faff; color:#1d4a6b; border:4px solid #5b93b8; box-shadow:0 5px 0 rgba(30,70,100,.35); }
  #homeBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(30,70,100,.35); }

  #bottombar{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding:12px; pointer-events:none; }
  #backBtn{ pointer-events:auto; cursor:pointer; font-family:inherit; font-size:clamp(21px,3.6vw,27px); font-weight:bold;
    color:#1d4a6b; background:#f2faff; border:3px solid #5b93b8; border-radius:999px; padding:12px 30px; box-shadow:0 4px 0 rgba(30,70,100,.35); text-decoration:none; }
  #backBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(30,70,100,.35); }
</style>
</head>
<body>
<div id="topbar">
  <button class="tbtn" id="bgmBtn">🎵 おんがく オン</button>
  <button class="tbtn" id="seBtn">🔔 おと オン</button>
  <div id="counter">🐙 <span id="countNum">0</span> / 30</div>
  <button class="tbtn" id="fsBtn">⛶ ぜんがめん</button>
</div>

<div id="gaugeWrap">
  <div id="gaugeLabel">🎵 ナビちゃんの リズム ゲージ</div>
  <div id="gaugeOuter"><div id="gaugeFill"></div></div>
</div>

<div id="laneWrap">
  <div id="lane"></div>
  <div id="laneArrow">タコが ながれてくるよ → 赤いわで たたこう！</div>
  <div id="hitZone"></div>
</div>
<div id="navi">
  <div id="hammer">🔨</div>
  <img id="naviImg" src="navi_warai_closed.png" alt="ナビちゃん">
  <div id="naviLabel">ナビちゃん</div>
</div>
<div id="bubble"></div>
<div id="bottombar"><a href="index.html" id="backBtn">🕐 とけいに もどる</a></div>

<div id="flashFx"></div>
<div id="boomText">🎉 リズム ばくはつ！</div>

<div id="title">
  <div class="tcard">
    <h2>🎵 ナビちゃん<br>リズムたたき</h2>
    <img class="timg" src="navi_warai_closed.png" alt="ナビちゃん">
    <p>ながれてくる タコを<br>🔨で たたこう！<br>
    30こ たたいたら おわりだよ<br>
    にげられても へいき！ まけなしだよ 😆</p>
    <button id="startBtn">▶ スタート</button>
  </div>
</div>

<div id="result">
  <div class="card">
    <h2>🎉 リズム ばくはつ！</h2>
    <p>タコを <span class="big">30</span> こ たたいたよ！<br>
    たたいた かずは<br>
    ぜんぶで <span class="big" id="rTotal">0</span> こ 🐙<br>
    きんのタコは <span class="big" id="rGold">0</span> こ ✨<br>
    <span id="rPraise">ノリノリだったね！ 😆</span></p>
    <div class="rbtns">
      <button class="rbtn" id="againBtn">▶ もういっかい</button>
      <button class="rbtn" id="homeBtn">🕐 とけいに もどる</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ナビちゃん リズムたたき v1.0 — たこなぐりの型（タップだけ・負けなし・30で終わり）で、
   ラン応用の音ゲー版。ノーツは左から右へ流れ、赤い輪のあたりで叩くと「ジャスト！」。 */
var GOAL = 30;
var BEAT_MS = 1000;      // 1拍＝1秒、ゆっくりめ
var TRAVEL_MS = 2600;    // ノーツが左端から右端まで流れる時間
var NOTES = ["🐙","🐙","🐙","🦑","🐡","🐟"];
var NAVI_WARAI = "navi_warai_closed.png";
var NAVI_TERE = "navi_tere_closed.png";

var hits = 0, total = 0, golds = 0, spawned = 0;
var running = false, spawnTimer = null, rafId = null;
var bgmOn = true, seOn = true, AC = null, bgmTimer = null, beatCount = 0;
var notes = []; // {el, born, gold, done}

var $ = function(id){ return document.getElementById(id); };
var laneWrap = $("laneWrap"), navi = $("navi"), naviImg = $("naviImg"), bubble = $("bubble");

/* --- 音（たこなぐりと同じ WebAudio 合成） --- */
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(freq, t0, dur, type, vol, slideTo){
  var c = ac(); if(!c) return;
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, c.currentTime + t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + t0 + dur);
  g.gain.setValueAtTime(vol || .2, c.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t0 + dur);
  o.connect(g); g.connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .02);
}
function noiseBurst(t0, dur, vol, freq){
  var c = ac(); if(!c) return;
  var len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  var src = c.createBufferSource(); src.buffer = buf;
  var f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq || 800;
  var g = c.createGain(); g.gain.value = vol || .4;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(c.currentTime + t0);
}
function seHit(){ if(seOn){ noiseBurst(0, .14, .5, 900); tone(160, 0, .16, "sine", .4, 60); tone(880, .02, .1, "triangle", .12); } }
function seGold(){ if(seOn){ [880,1174,1568].forEach(function(f,i){ tone(f, i*.07, .18, "triangle", .16); }); } }
function seBoom(){ if(seOn){ noiseBurst(0, .7, .6, 500); [523,659,784,1046].forEach(function(f,i){ tone(f, i*.09, .4, "triangle", .18); }); } }
/* ドラムだけのゆっくりループ：1拍ごとにドン、半拍でチッ */
function bgmStart(){
  if(bgmTimer) return;
  beatCount = 0;
  bgmTimer = setInterval(function(){
    if(!bgmOn) return;
    beatCount++;
    tone(150, 0, .18, "sine", .5, 55);            // キック
    setTimeout(function(){ if(bgmOn) tone(1200, 0, .05, "square", .05); }, BEAT_MS / 2); // ハット
    if(beatCount % 4 === 0) tone(660, 0, .12, "triangle", .08); // 4拍ごとにピッ
  }, BEAT_MS);
}
function bgmStop(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; } }

/* --- 表示まわり --- */
function paintBtns(){
  $("bgmBtn").textContent = bgmOn ? "🎵 おんがく オン" : "🎵 おんがく オフ";
  $("seBtn").textContent = seOn ? "🔔 おと オン" : "🔔 おと オフ";
}
function say(text, ms){
  bubble.textContent = text; bubble.classList.add("show");
  clearTimeout(say._t); say._t = setTimeout(function(){ bubble.classList.remove("show"); }, ms || 2200);
}
function setNavi(src, backMs){
  naviImg.src = src;
  if(backMs){ clearTimeout(setNavi._t); setNavi._t = setTimeout(function(){ naviImg.src = NAVI_WARAI; }, backMs); }
}
function flash(){
  var f = $("flashFx"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
}
function judge(text, x, y){
  var el = document.createElement("div");
  el.className = "judge"; el.textContent = text;
  el.style.left = x + "px"; el.style.top = y + "px";
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 750);
}

/* --- ノーツ --- */
function spawn(){
  if(!running || spawned >= GOAL + 8) return; // 逃げ分を少し多めに流す
  spawned++;
  var gold = Math.random() < 0.06;
  var el = document.createElement("div");
  el.className = "note" + (gold ? " gold" : "");
  el.textContent = gold ? "🐙" : NOTES[Math.floor(Math.random() * NOTES.length)];
  el.addEventListener("pointerdown", function(ev){ ev.preventDefault(); hitNote(nt); });
  laneWrap.appendChild(el);
  var nt = { el: el, born: performance.now(), gold: gold, done: false };
  notes.push(nt);
}
function laneRect(){ return laneWrap.getBoundingClientRect(); }
function noteX(nt, now){
  var r = laneRect();
  var p = (now - nt.born) / TRAVEL_MS; // 0→1
  return r.left + r.width * 0.02 + p * r.width * 0.96;
}
function tick(now){
  if(!running) return;
  var r = laneRect();
  var zoneX = r.left + r.width * 0.89; // 赤い輪の中心あたり
  for(var i = notes.length - 1; i >= 0; i--){
    var nt = notes[i];
    if(nt.done) continue;
    var x = noteX(nt, now);
    nt.el.style.left = x + "px";
    if(x > r.right + 60){ // 右端を過ぎたら逃げた扱い（ペナルティなし）
      nt.done = true; nt.el.remove(); notes.splice(i, 1);
      setNavi(NAVI_TERE, 1200); say("にげちゃった〜 つぎ いくよ！", 1600);
    }
  }
  rafId = requestAnimationFrame(tick);
}
function hitNote(nt){
  if(!running || nt.done) return;
  nt.done = true;
  var now = performance.now();
  var r = laneRect();
  var zoneX = r.left + r.width * 0.89;
  var just = Math.abs(noteX(nt, now) - zoneX) < 150;
  var x = noteX(nt, now), y = r.top + r.height / 2;
  nt.el.classList.add("hit");
  setTimeout(function(){ nt.el.remove(); }, 260);
  var idx = notes.indexOf(nt); if(idx >= 0) notes.splice(idx, 1);
  navi.classList.remove("swing"); void navi.offsetWidth; navi.classList.add("swing");
  if(nt.gold){ hits += 3; total += 3; golds++; seGold(); judge("✨ きんのタコ！ +3", x, y - 60); }
  else { hits += 1; total += 1; seHit(); judge(just ? "ジャスト！" : "バシッ！", x, y - 60); }
  if(hits > GOAL) hits = GOAL;
  $("countNum").textContent = hits;
  $("gaugeFill").style.width = (hits / GOAL * 100) + "%";
  if(hits === 10) say("いいリズム！ そのちょうし！");
  if(hits === 20) say("あと 10こ！ ノリノリだね！");
  if(hits >= GOAL) finish();
}

/* --- 進行 --- */
function start(){
  ac();
  $("title").classList.add("hide");
  $("result").classList.remove("show");
  hits = 0; total = 0; golds = 0; spawned = 0;
  notes.forEach(function(nt){ nt.el.remove(); }); notes = [];
  $("countNum").textContent = "0";
  $("gaugeFill").style.width = "0%";
  running = true;
  say("タコが ながれてきたら たたいてね！", 2600);
  bgmStart();
  spawnTimer = setInterval(spawn, BEAT_MS);
  spawn();
  rafId = requestAnimationFrame(tick);
}
function finish(){
  running = false;
  clearInterval(spawnTimer); spawnTimer = null;
  if(rafId) cancelAnimationFrame(rafId);
  bgmStop();
  notes.forEach(function(nt){ nt.el.remove(); }); notes = [];
  flash(); seBoom();
  setNavi(NAVI_WARAI);
  var b = $("boomText"); b.classList.remove("go"); void b.offsetWidth; b.classList.add("go");
  setTimeout(function(){
    $("rTotal").textContent = total;
    $("rGold").textContent = golds;
    $("result").classList.add("show");
  }, 1400);
}
function goHome(){ location.href = "index.html"; }

/* --- ボタン --- */
$("startBtn").addEventListener("click", function(){ ac(); start(); });
$("againBtn").addEventListener("click", function(){ start(); });
$("homeBtn").addEventListener("click", goHome);
$("bgmBtn").addEventListener("click", function(){ bgmOn = !bgmOn; if(!bgmOn) bgmStop(); else if(running) bgmStart(); paintBtns(); });
$("seBtn").addEventListener("click", function(){ seOn = !seOn; paintBtns(); });
var fsBtn = $("fsBtn");
function syncFsLabel(){ fsBtn.textContent = document.fullscreenElement ? "⛶ もどす" : "⛶ ぜんがめん"; }
fsBtn.addEventListener("click", function(){
  if(document.fullscreenElement) document.exitFullscreen().catch(function(){});
  else document.documentElement.requestFullscreen().catch(function(){});
});
document.addEventListener("fullscreenchange", syncFsLabel);
paintBtns();

/* 埋め込み（時計の窓の中）対応 */
if(window.self !== window.top){
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href="index.html"]');
    if(a){ e.preventDefault(); parent.postMessage("closeGame", "*"); }
  });
}

/* テスト用フック（実機では使わない） */
window.__rhythm = {
  get hits(){ return hits; }, get spawned(){ return spawned; },
  get running(){ return running; },
  start: start, hitFirst: function(){
    var nt = notes.find(function(n){ return !n.done; });
    if(nt) hitNote(nt); return !!nt;
  }
};
</script>
