<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>たこなぐり｜ナビちゃんの ストレスばくはつ</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:linear-gradient(180deg,#ffe9d6 0%,#ffd9c4 55%,#ffc9b0 100%);
    color:#5a2d16; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  /* 上部バー */
  #topbar{ position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:flex-start; gap:8px; padding:10px; pointer-events:none; }
  .tbtn{ pointer-events:auto; cursor:pointer; font-family:inherit; font-size:19px; font-weight:bold; color:#7a3410;
    background:#fff8f0; border:3px solid #d97b3f; border-radius:999px; padding:10px 18px; box-shadow:0 3px 0 rgba(140,70,20,.35); }
  .tbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(140,70,20,.35); }
  #counter{ margin:0 auto; background:rgba(255,252,240,.96); border:4px solid #e88bb0; border-radius:999px;
    padding:8px 30px; font-size:clamp(24px,4.6vw,38px); font-weight:bold; color:#a03d63; box-shadow:0 4px 0 rgba(150,60,90,.3); white-space:nowrap; }

  /* ストレスゲージ */
  #gaugeWrap{ position:fixed; top:96px; left:50%; transform:translateX(-50%); z-index:25; width:min(88vw,620px); text-align:center; }
  #gaugeLabel{ font-size:clamp(19px,3.2vw,25px); font-weight:bold; color:#8a3b12; text-shadow:0 2px 0 rgba(255,255,255,.6); margin-bottom:4px; }
  #gaugeOuter{ height:30px; background:rgba(255,255,255,.75); border:4px solid #b85c1e; border-radius:999px; overflow:hidden; box-shadow:0 3px 0 rgba(140,70,20,.3); }
  #gaugeFill{ height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,#ffb03a,#ff7038,#f22e2e); transition:width .35s ease; }
  #gaugeWrap.hot #gaugeLabel{ animation:hotShake .3s infinite; }
  @keyframes hotShake{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-2px);} 75%{ transform:translateX(2px);} }

  /* ステージ（穴とタコ） */
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:190px 12px 110px; }
  #grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:2.2vmin 3vmin; width:min(94vw,760px); }
  .hole{ position:relative; height:clamp(120px,24vh,190px); }
  .clip{ position:absolute; left:0; right:0; bottom:22px; height:clamp(120px,22vh,180px); overflow:hidden; z-index:2; }
  .tako{ position:absolute; left:50%; bottom:0; transform:translate(-50%,104%) scale(1);
    font-size:clamp(76px,15vmin,118px); line-height:1; cursor:pointer;
    transition:transform .18s ease-out; filter:drop-shadow(0 4px 4px rgba(90,40,0,.35)); }
  .hole.up .tako{ transform:translate(-50%,0) scale(1); }
  .hole.hit .tako{ transform:translate(-50%,8%) scale(1.25,.35); transition:transform .08s; }
  .tako.gold{ filter:drop-shadow(0 0 14px gold) drop-shadow(0 4px 4px rgba(90,40,0,.35)); }
  .rim{ position:absolute; left:50%; bottom:6px; transform:translateX(-50%); z-index:3;
    width:clamp(110px,20vmin,160px); height:clamp(34px,6vmin,48px);
    background:radial-gradient(ellipse at 50% 38%, #8a5a30 0%, #6e4423 55%, #54331a 100%);
    border-radius:50%; box-shadow:inset 0 -8px 10px rgba(0,0,0,.45), 0 4px 6px rgba(90,40,0,.3); pointer-events:none; }
  .burst{ position:absolute; left:50%; bottom:70px; transform:translateX(-50%); z-index:5; pointer-events:none;
    font-size:clamp(30px,6vmin,46px); font-weight:bold; color:#e0331f; text-shadow:0 2px 0 #fff, 0 0 12px #ffd23a;
    opacity:0; white-space:nowrap; }
  .hole.hit .burst{ animation:burstPop .5s ease-out forwards; }
  @keyframes burstPop{ 0%{ opacity:0; transform:translateX(-50%) scale(.5);} 30%{ opacity:1; transform:translateX(-50%) scale(1.25);} 100%{ opacity:0; transform:translateX(-50%) translateY(-26px) scale(1);} }
  .spark{ position:fixed; z-index:46; pointer-events:none; animation:sparkFly .8s ease-out forwards; }
  @keyframes sparkFly{ 0%{ transform:translate(0,0) scale(1); opacity:1; } 100%{ transform:translate(var(--dx),var(--dy)) scale(.4); opacity:0; } }

  /* ナビちゃんと吹き出し */
  #choco{ position:fixed; left:10px; bottom:86px; z-index:20; width:clamp(96px,17vw,150px); pointer-events:none; }
  #choco img{ width:100%; display:block; }
  #bubble{ position:fixed; left:14px; bottom:calc(86px + clamp(96px,17vw,150px) + 6px); z-index:20; max-width:min(56vw,400px);
    background:#fffdf4; border:3px solid #e8a13a; border-radius:16px; padding:10px 14px;
    font-size:clamp(19px,3vw,25px); font-weight:bold; color:#6b4423; line-height:1.5;
    box-shadow:0 4px 10px rgba(120,70,0,.25); opacity:0; transition:opacity .35s ease; pointer-events:none; }
  #bubble.show{ opacity:1; }
  #bubble::after{ content:""; position:absolute; left:34px; bottom:-12px; border:6px solid transparent; border-top:8px solid #e8a13a; }
  @media (max-height:700px){ #bubble{ max-width:260px; font-size:19px; } }

  /* 画面全体の閃光 */
  #flashFx{ position:fixed; inset:0; z-index:44; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.98) 0%, rgba(255,214,120,.85) 45%, rgba(255,140,60,.35) 75%, transparent 100%); }
  #flashFx.go{ animation:flashGo .7s ease-out; }
  @keyframes flashGo{ 0%{ opacity:0; } 18%{ opacity:1; } 100%{ opacity:0; } }
  /* ばくはつの大きな文字 */
  #boomText{ position:fixed; inset:0; z-index:47; display:flex; align-items:center; justify-content:center; pointer-events:none;
    font-size:clamp(52px,11vw,110px); font-weight:bold; color:#f22e2e; -webkit-text-stroke:3px #fff;
    text-shadow:0 6px 0 rgba(160,40,0,.35), 0 0 34px #ffd23a; opacity:0; }
  #boomText.go{ animation:boomGo 2.2s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes boomGo{ 0%{ opacity:0; transform:scale(.3) rotate(-6deg);} 18%{ opacity:1; transform:scale(1.15) rotate(2deg);} 30%{ transform:scale(1);} 80%{ opacity:1;} 100%{ opacity:0; transform:scale(1.05);} }

  #fadeVeil{ position:fixed; inset:0; z-index:35; background:#fff; opacity:0; pointer-events:none; transition:opacity .8s ease; }

  /* リザルト画面 */
  #result{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(255,244,230,.72); }
  #result.show{ display:flex; }
  .card{ background:#fffdf6; border:6px solid #d97b3f; border-radius:34px; padding:34px 44px; text-align:center;
    box-shadow:0 14px 40px rgba(120,60,0,.35); max-width:min(92vw,560px); animation:cardIn .5s cubic-bezier(.2,1.5,.4,1); }
  @keyframes cardIn{ 0%{ transform:scale(.7); opacity:0;} 100%{ transform:scale(1); opacity:1;} }
  .card h2{ font-size:clamp(34px,6.4vw,50px); color:#d43a12; margin-bottom:10px; }
  .card p{ font-size:clamp(22px,4vw,30px); font-weight:bold; color:#6b4423; line-height:1.7; }
  .card .big{ font-size:clamp(40px,8vw,58px); color:#e0331f; }
  .rbtns{ display:flex; gap:14px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  .rbtn{ cursor:pointer; font-family:inherit; font-size:clamp(23px,4vw,30px); font-weight:bold; border-radius:999px; padding:14px 30px; }
  #againBtn{ background:#ff8c42; color:#fff; border:4px solid #d96a1e; box-shadow:0 5px 0 rgba(160,80,10,.5); }
  #againBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(160,80,10,.5); }
  #homeBtn{ background:#f2faff; color:#1d4a6b; border:4px solid #5b93b8; box-shadow:0 5px 0 rgba(30,70,100,.35); }
  #homeBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(30,70,100,.35); }

  #bottombar{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding:12px; pointer-events:none; }
  #backBtn{ pointer-events:auto; cursor:pointer; font-family:inherit; font-size:clamp(21px,3.6vw,27px); font-weight:bold;
    color:#1d4a6b; background:#f2faff; border:3px solid #5b93b8; border-radius:999px; padding:12px 30px; box-shadow:0 4px 0 rgba(30,70,100,.35); }
  #backBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(30,70,100,.35); }
</style>
</head>
<body>
<div id="topbar">
  <button class="tbtn" id="bgmBtn">🎵 おんがく オン</button>
  <button class="tbtn" id="seBtn">🔔 おと オン</button>
  <div id="counter">🐙 <span id="countNum">0</span> / 30 ひき</div>
  <button class="tbtn" id="fsBtn">⛶ ぜんがめん</button>
</div>

<div id="gaugeWrap">
  <div id="gaugeLabel">💢 ナビちゃんの ストレス ゲージ</div>
  <div id="gaugeOuter"><div id="gaugeFill"></div></div>
</div>

<div id="stage"><div id="grid"></div></div>

<div id="choco"><img id="chocoImg" alt="ナビちゃん"></div>
<div id="bubble"></div>
<div id="bottombar"><a href="index.html" id="backBtn" style="text-decoration:none;">🕐 とけいに もどる</a></div>

<div id="result">
  <div class="card">
    <h2>🎉 ストレス ばくはつ！</h2>
    <p>タコを <span class="big">30</span> ひき たたいたよ！<br>
    いままでに たたいた タコは<br>
    ぜんぶで <span class="big" id="rTotal">0</span> ひき 🐙<br>
    <span id="rPraise">すっきりしたね！ 😆</span></p>
    <div class="rbtns">
      <button class="rbtn" id="againBtn">▶ もういっかい</button>
      <button class="rbtn" id="homeBtn">🕐 とけいに もどる</button>
    </div>
  </div>
</div>

/* ================= 音（WebAudio合成） ================= */
let AC = null;
let bgmOn = localStorage.getItem("tako_bgm") !== "0";
let seOn  = localStorage.getItem("tako_se")  !== "0";
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(freq, t0, dur, type, vol, slideTo){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, c.currentTime + t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + t0 + dur);
  g.gain.setValueAtTime(0.0001, c.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol, c.currentTime + t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
  o.connect(g); g.connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
}
function noiseBurst(t0, dur, vol, freq){
  const c = ac(); if(!c) return;
  const len = Math.max(1, (dur * c.sampleRate)|0);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq || 900;
  const g = c.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(c.currentTime + t0);
}
function sePop(){ if(seOn){ tone(300, 0, .16, "sine", .16, 660); } }
function seHit(){ if(seOn){ noiseBurst(0, .14, .5, 800); tone(160, 0, .16, "sine", .4, 60); tone(880, .02, .1, "triangle", .12); } }
function seGold(){ if(seOn){ [880,1174,1568].forEach((f,i)=> tone(f, i*.07, .18, "triangle", .16)); } }
function seBoom(){
  if(!seOn) return;
  noiseBurst(0, .7, .6, 500); tone(120, 0, .7, "sawtooth", .25, 30);
  [523,659,784,1046,784,1046,1318].forEach((f,i)=> tone(f, .25 + i*.11, .22, "triangle", .18));
}
/* BGM：明るいループ */
const BGM_NOTES = [523,587,659,784, 880,784,659,587, 523,587,659,587, 392,494,587,494];
let bgmTimer = null, bgmStep = 0;
function bgmStart(){
  if(!bgmOn || bgmTimer) return;
  bgmTimer = setInterval(() => {
    if(!bgmOn){ return; }
    const f = BGM_NOTES[bgmStep % BGM_NOTES.length];
    tone(f, 0, .24, "triangle", .055);
    if(bgmStep % 2 === 0) tone(f/2, 0, .3, "sine", .045);
    bgmStep++;
  }, 215);
}
function bgmStop(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; } }
const bgmBtn = document.getElementById("bgmBtn");
const seBtn = document.getElementById("seBtn");
function paintBtns(){
  bgmBtn.textContent = bgmOn ? "🎵 おんがく オン" : "🎵 おんがく オフ";
  seBtn.textContent = seOn ? "🔔 おと オン" : "🔔 おと オフ";
}
bgmBtn.addEventListener("click", () => { bgmOn = !bgmOn; localStorage.setItem("tako_bgm", bgmOn ? "1" : "0"); if(bgmOn){ ac(); bgmStart(); } else bgmStop(); paintBtns(); });
seBtn.addEventListener("click", () => { seOn = !seOn; localStorage.setItem("tako_se", seOn ? "1" : "0"); paintBtns(); if(seOn) seHit(); });
paintBtns();

const chocoImg = document.getElementById("chocoImg");
const bubble = document.getElementById("bubble");
let bubbleTimer = null, naviTimer = null;
chocoImg.src = NAVI_KOMARI;
function setNavi(src, backMs){
  chocoImg.src = src;
  if(naviTimer) clearTimeout(naviTimer);
  if(backMs) naviTimer = setTimeout(() => { chocoImg.src = NAVI_KOMARI; }, backMs);
}
function say(text, ms){
  bubble.textContent = text;
  bubble.classList.add("show");
  if(bubbleTimer) clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove("show"), ms || 3000);
}

const GOAL = 30;
const grid = document.getElementById("grid");
const countNum = document.getElementById("countNum");
const gaugeFill = document.getElementById("gaugeFill");
const gaugeWrap = document.getElementById("gaugeWrap");
let hits = 0, finished = false;
let totalHits = parseInt(localStorage.getItem("tako_total") || "0", 10) || 0;
const holes = [];
for(let i = 0; i < 6; i++){
  const h = document.createElement("div");
  h.className = "hole";
  h.innerHTML = `<div class="clip"><div class="tako">🐙</div></div><div class="rim"></div><div class="burst">バシッ！</div>`;
  grid.appendChild(h);
  const st = { el: h, tako: h.querySelector(".tako"), up: false, gold: false, hideTimer: null };
  st.tako.addEventListener("click", () => hitHole(st));
  holes.push(st);
}
function sparks(x, y, n, emojis){
  for(let i = 0; i < (n || 10); i++){
    const s = document.createElement("span");
    s.className = "spark";
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.fontSize = (18 + Math.random()*22) + "px";
    const ang = Math.random()*Math.PI*2, dist = 60 + Math.random()*110;
    s.style.setProperty("--dx", Math.cos(ang)*dist + "px");
    s.style.setProperty("--dy", (Math.sin(ang)*dist - 40) + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 850);
  }
}
function upDuration(){ return Math.max(1500, 2150 - hits * 22); }
function maxActive(){ return hits >= 10 ? 2 : 1; }
function spawn(){
  if(finished) return;
  const active = holes.filter(h => h.up).length;
  if(active >= maxActive()) return;
  const idle = holes.filter(h => !h.up);
  if(!idle.length) return;
  const st = idle[Math.floor(Math.random()*idle.length)];
  st.up = true;
  st.gold = Math.random() < 0.06;
  st.tako.classList.toggle("gold", st.gold);
  st.el.classList.add("up");
  sePop();
  st.hideTimer = setTimeout(() => hideHole(st), upDuration());
}
function hideHole(st){
  st.up = false;
  st.el.classList.remove("up");
  if(st.hideTimer){ clearTimeout(st.hideTimer); st.hideTimer = null; }
}
function hitHole(st){
  if(!st.up || finished) return;
  ac(); bgmStart();
  hideHole(st);
  st.el.classList.add("hit");
  setTimeout(() => st.el.classList.remove("hit"), 240);
  const gain = st.gold ? 3 : 1;
  const r = st.tako.getBoundingClientRect();
  sparks(r.left + r.width/2, r.top + r.height/3, st.gold ? 16 : 10, st.gold ? ["✨","⭐","💛","✨"] : ["💥","⭐","✨"]);
  if(st.gold){ seGold(); say("きんの タコ！ 3ひきぶん！ ✨", 1800); } else seHit();
  hits = Math.min(GOAL, hits + gain);
  totalHits += gain;
  localStorage.setItem("tako_total", String(totalHits));
  countNum.textContent = String(hits);
  gaugeFill.style.width = (hits / GOAL * 100) + "%";
  gaugeWrap.classList.toggle("hot", hits >= GOAL - 5 && hits < GOAL);
  if(hits >= GOAL){ finish(); return; }
  if(hits === 10) say("タコが 2ひきずつ でてくるよ！", 2200);
  if(hits === 25) say("もうすぐ ストレス ばくはつ！ 💢", 2200);
  setTimeout(spawn, 250);
}
/* フィナーレ：ストレス爆発 */
const flashFx = document.createElement("div"); flashFx.id = "flashFx"; document.body.appendChild(flashFx);
const boomText = document.createElement("div"); boomText.id = "boomText"; boomText.textContent = "💥 ストレス ばくはつ！"; document.body.appendChild(boomText);
const resultEl = document.getElementById("result");
function finish(){
  finished = true;
  holes.forEach(hideHole);
  seBoom();
  flashFx.classList.remove("go"); void flashFx.offsetWidth; flashFx.classList.add("go");
  boomText.classList.remove("go"); void boomText.offsetWidth; boomText.classList.add("go");
  setNavi(NAVI_ODOROKI);
  sparks(window.innerWidth/2, window.innerHeight/2, 34, ["💥","⭐","✨","🎉","💢"]);
  say("ばくはつー！ すっきり！", 2600);
  setTimeout(() => {
    setNavi(NAVI_WARAI);
    document.getElementById("rTotal").textContent = String(totalHits);
    resultEl.classList.add("show");
  }, 2300);
}
document.getElementById("againBtn").addEventListener("click", () => {
  resultEl.classList.remove("show");
  hits = 0; finished = false;
  countNum.textContent = "0";
  gaugeFill.style.width = "0%";
  gaugeWrap.classList.remove("hot");
  chocoImg.src = NAVI_KOMARI;
  say("もういちど！ タコを たたいてね！", 2200);
  setTimeout(spawn, 500);
});
function goHome(){
  if(inIframe) parent.postMessage("closeGame", "*");
  else location.href = "index.html";
}
document.getElementById("homeBtn").addEventListener("click", goHome);
const backBtn = document.getElementById("backBtn");
if(inIframe){
  backBtn.addEventListener("click", (e) => { e.preventDefault(); goHome(); });
}
/* スポーンループ＆開始 */
setInterval(() => { if(!finished && Math.random() < 0.85) spawn(); }, 950);
say("タコが でてきたら、タップして たたいてね！ 30ひきで ストレス ばくはつ！", 4200);
setTimeout(spawn, 700);
window.__tako = {
  get hits(){ return hits; },
  get total(){ return totalHits; },
  get finished(){ return finished; },
  get activeCount(){ return holes.filter(h => h.up).length; },
  spawnNow(){ spawn(); },
  hitActive(){ const st = holes.find(h => h.up); if(st) hitHole(st); return !!st; },
  holeUp(i){ return holes[i].up; },
  tapHole(i){ hitHole(holes[i]); },
  setHits(n){ hits = n; countNum.textContent = String(n); gaugeFill.style.width = (n/GOAL*100) + "%"; }
};
</script>
</body>
