<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>えあてクイズ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    background:linear-gradient(#fff6e0 0%, #ffeec9 55%, #ffe3ae 100%);
  }
  /* 上部バー */
  #topbar{ position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:flex-start; gap:8px; padding:10px; pointer-events:none; }
  .tbtn{ pointer-events:auto; cursor:pointer; font-family:inherit; font-size:19px; font-weight:bold; color:#6b4d14;
    background:#fff8ea; border:3px solid #b08d4f; border-radius:999px; padding:10px 18px; box-shadow:0 3px 0 rgba(90,60,20,.35); }
  .tbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(90,60,20,.35); }
  #counter{ margin:0 auto; background:rgba(255,252,240,.96); border:4px solid #e88bb0; border-radius:999px;
    padding:8px 30px; font-size:clamp(24px,4.6vw,38px); font-weight:bold; color:#a03d63; box-shadow:0 4px 0 rgba(150,60,90,.3); white-space:nowrap; }

  /* 問題 */
  #qArea{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; padding:96px 16px 132px; }
  #qText{ font-size:clamp(26px,5vw,44px); font-weight:bold; color:#7a4d00; text-align:center; line-height:1.45;
    background:rgba(255,255,255,.85); border:4px solid #ffb84d; border-radius:26px; padding:16px 30px; box-shadow:0 4px 0 rgba(160,100,20,.25); }
  #qText .bigKana{ display:inline-block; font-size:1.7em; color:#d6336c; background:#ffe3ee; border-radius:16px; padding:0 14px; margin:0 4px; vertical-align:-8%; }
  /* 選択肢タイル（2×2・特大） */
  #tiles{ margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:16px; width:min(92vw, 640px); }
  .tile{ cursor:pointer; font-family:inherit; background:#fff; border:5px solid #7db3dd; border-radius:30px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:10px;
    box-shadow:0 6px 0 rgba(50,100,150,.3); transition:opacity .4s ease, transform .15s ease; }
  .tile:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(50,100,150,.3); }
  .tile .emo{ font-size:clamp(56px,11vw,88px); line-height:1.15; }
  .tile .nm{ font-size:clamp(22px,4.4vw,34px); font-weight:bold; color:#33526e; }
  .tile .txt{ font-size:clamp(52px,11vw,88px); font-weight:bold; color:#33526e; line-height:1.2; }
  .tile.wrong{ opacity:.28; pointer-events:none; filter:grayscale(.6); }
  .tile.right{ border-color:#ff8fab; background:#fff0f5; animation:rightPop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes rightPop{ 0%{ transform:scale(.92);} 60%{ transform:scale(1.06);} 100%{ transform:scale(1);} }
  @keyframes shake{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-7px);} 75%{ transform:translateX(7px);} }
  .tile.shake{ animation:shake .3s ease; }

  /* 大きな ⭕ */
  #judge{ position:fixed; inset:0; z-index:45; display:flex; align-items:center; justify-content:center; pointer-events:none;
    font-size:min(62vw, 430px); opacity:0; transform:scale(.4); }
  #judge.show{ animation:judgePop 1s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes judgePop{ 0%{ opacity:0; transform:scale(.4);} 30%{ opacity:1; transform:scale(1.08);} 45%{ transform:scale(1);} 80%{ opacity:1;} 100%{ opacity:0; transform:scale(1.02);} }
  .spark{ position:fixed; z-index:46; pointer-events:none; animation:sparkFly .8s ease-out forwards; }
  @keyframes sparkFly{ from{ transform:translate(-50%,-50%) scale(1); opacity:1;} to{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3); opacity:0;} }

  /* ナビちゃん */
  #choco{ position:fixed; left:10px; bottom:86px; z-index:20; width:clamp(96px,17vw,150px); pointer-events:none; }
  #choco img{ width:100%; display:block; }
  #bubble{ position:fixed; left:14px; bottom:calc(86px + clamp(96px,17vw,150px) + 6px); z-index:20; max-width:min(56vw,400px);
    background:#fff; border:4px solid #f0b429; border-radius:20px; padding:12px 18px;
    font-size:clamp(19px,3.4vw,27px); font-weight:bold; color:#5a4512; box-shadow:0 4px 0 rgba(140,90,20,.3); }
  #bubble:after{ content:""; position:absolute; left:44px; bottom:-16px; border:8px solid transparent; border-top:10px solid #f0b429; }

  #announce{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; opacity:0; transition:opacity .45s ease; text-align:center; padding:20px; }
  #announce.show{ opacity:1; }
  #announce .big{ font-size:clamp(44px,9vw,92px); font-weight:bold; color:#fff;
    text-shadow:0 4px 0 rgba(160,50,90,.55), 0 0 34px rgba(255,120,170,.75); line-height:1.3; }
  #fadeVeil{ position:fixed; inset:0; z-index:35; background:#fff; opacity:0; pointer-events:none; transition:opacity .8s ease; }

  /* リザルト */
  #result{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(255,244,214,.82); padding:18px; }
  #result.show{ display:flex; }
  #result .card{ background:#fff; border:6px solid #ffb84d; border-radius:34px; padding:30px 40px; text-align:center;
    max-width:min(92vw, 620px); box-shadow:0 12px 34px rgba(150,90,20,.35); }
  #result .rbig{ font-size:clamp(38px,7.5vw,62px); font-weight:bold; color:#d6336c; }
  #result .rline{ margin-top:8px; font-size:clamp(24px,4.6vw,36px); font-weight:bold; color:#7a4d00; }
  #result .rscore{ margin-top:16px; font-size:clamp(26px,5vw,40px); font-weight:bold; color:#a03d63;
    background:#fff0f5; border:3px dashed #ff8fab; border-radius:20px; padding:10px 16px; }
  #result .rpraise{ margin-top:12px; font-size:clamp(22px,4.2vw,32px); font-weight:bold; color:#b57708; }
  #result .rtotal{ margin-top:10px; font-size:clamp(18px,3.4vw,24px); font-weight:bold; color:#8a6d3b; }
  #result .rbtns{ margin-top:22px; display:flex; flex-direction:column; gap:14px; align-items:center; }
  #againBtn{ cursor:pointer; font-family:inherit; font-size:clamp(24px,4.6vw,34px); font-weight:bold; color:#fff;
    background:#ff7aa2; border:4px solid #e75480; border-radius:999px; padding:14px 38px; box-shadow:0 5px 0 rgba(170,50,90,.4); }
  #againBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(170,50,90,.4); }
  #rBack{ text-decoration:none; font-size:clamp(22px,4vw,30px); font-weight:bold; color:#20506e;
    background:#dceefb; border:4px solid #7db3dd; border-radius:999px; padding:12px 34px; box-shadow:0 5px 0 rgba(40,90,130,.35); }

  /* 下部 */
  #bottombar{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding:12px; pointer-events:none; }
  a.backbtn{ pointer-events:auto; text-decoration:none; font-size:clamp(22px,4vw,30px); font-weight:bold; color:#20506e;
    background:#dceefb; border:4px solid #7db3dd; border-radius:999px; padding:14px 34px; box-shadow:0 5px 0 rgba(40,90,130,.35); }
  a.backbtn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(40,90,130,.35); }
</style>
</head>
<body>
<div id="topbar">
  <button class="tbtn" id="bgmBtn">🎵 おんがく オン</button>
  <button class="tbtn" id="seBtn">🔔 おと オン</button>
  <button class="tbtn" id="maskBtn">＊ ふせじ オン</button>
  <div id="counter">⭐ <span id="countNum">0</span> / 10 もん</div>
  <button class="tbtn" id="fsBtn">⛶ ぜんがめん</button>
</div>

<div id="qArea">
  <div id="qText"></div>
  <div id="tiles"></div>
</div>

<div id="bubble">クイズだよ！<br>あててみてね 😊</div>
<div id="choco"><img src="character.png" alt="" onerror="this.parentNode.style.display='none'"></div>

<div id="judge">⭕</div>
<div id="fadeVeil" style="opacity:1"></div>
<div id="announce"><div class="big"></div></div>

<!-- リザルト（10問で区切り：出口） -->
<div id="result">
  <div class="card">
    <div class="rbig">🎉 おつかれさま！</div>
    <div class="rline">10もん おわったよ</div>
    <div class="rscore">いっかいで あたった ⭐ <span id="rFirst">0</span> もん</div>
    <div class="rpraise" id="rPraise"></div>
    <div class="rtotal">ぜんぶで ⭐ <span id="rTotal">0</span> もん せいかい</div>
    <div class="rbtns">
      <button id="againBtn">▶ もういちど あそぶ</button>
      <a id="rBack" href="index.html">🕐 とけいに もどる</a>
    </div>
  </div>
</div>

<div id="bottombar"><a class="backbtn" href="index.html">🕐 とけいに もどる</a></div>

<script>
"use strict";
/* ============================================================
   えあてクイズ v1.0（老人向け・かなオセロのクイズ部分だけを独立化）
   起動したら即1問目。モード選択・設定・タイマーなし。
   間違えても そのタイルが薄くなるだけ（消去法で必ず正解できる）。
   終わりなし・負けなし。
   ============================================================ */
/* 絵と名前のデータ（かなオセロと同一：ダブルネーム対応） */
const ITEMS = [
  {emoji:"🍬",names:["あめ"]},{emoji:"🐶",names:["いぬ"]},{emoji:"🐮",names:["うし"]},{emoji:"🐰",names:["うさぎ"]},{emoji:"🦐",names:["えび"]},{emoji:"🍪",names:["おかし","くっきー"]},
  {emoji:"🦆",names:["あひる"]},{emoji:"🍓",names:["いちご"]},{emoji:"🪑",names:["いす"]},{emoji:"✏️",names:["えんぴつ"]},{emoji:"🍙",names:["おにぎり"]},{emoji:"🍵",names:["おちゃ"]},
  {emoji:"🐢",names:["かめ"]},{emoji:"🌳",names:["き"]},{emoji:"☁️",names:["くも"]},{emoji:"🍰",names:["けーき"]},{emoji:"🍚",names:["こめ"]},
  {emoji:"🦀",names:["かに"]},{emoji:"🎃",names:["かぼちゃ"]},{emoji:"🦊",names:["きつね"]},{emoji:"🍄",names:["きのこ"]},{emoji:"🐻",names:["くま"]},{emoji:"🧶",names:["けいと"]},{emoji:"🎏",names:["こいのぼり"]},
  {emoji:"🐵",names:["さる"]},{emoji:"🦌",names:["しか"]},{emoji:"🍣",names:["すし"]},{emoji:"🧼",names:["せっけん"]},{emoji:"🍦",names:["そふとくりーむ"]},
  {emoji:"🐟",names:["さかな"]},{emoji:"🍒",names:["さくらんぼ"]},{emoji:"📰",names:["しんぶん"]},{emoji:"🍉",names:["すいか"]},{emoji:"🍘",names:["せんべい"]},{emoji:"🧦",names:["そっくす"]},
  {emoji:"🥚",names:["たまご"]},{emoji:"🗺️",names:["ちず","まっぷ"]},{emoji:"🌙",names:["つき"]},{emoji:"✉️",names:["てがみ"]},{emoji:"🕐",names:["とけい"]},
  {emoji:"🐙",names:["たこ"]},{emoji:"🎋",names:["たなばた"]},{emoji:"🧀",names:["ちーず"]},{emoji:"🎣",names:["つり"]},{emoji:"📺",names:["てれび"]},{emoji:"🧤",names:["てぶくろ"]},{emoji:"🍅",names:["とまと"]},{emoji:"🚪",names:["とびら"]},
  {emoji:"🍐",names:["なし"]},{emoji:"🌈",names:["にじ"]},{emoji:"🧸",names:["ぬいぐるみ"]},{emoji:"🐱",names:["ねこ"]},{emoji:"📓",names:["のーと"]},
  {emoji:"🍆",names:["なす"]},{emoji:"🌊",names:["なみ"]},{emoji:"🥕",names:["にんじん"]},{emoji:"🖌️",names:["ぬりえ"]},{emoji:"🐭",names:["ねずみ"]},{emoji:"🚗",names:["のりもの"]},
  {emoji:"🌸",names:["はな"]},{emoji:"🌻",names:["ひまわり"]},{emoji:"🚢",names:["ふね"]},{emoji:"🐍",names:["へび"]},{emoji:"⭐",names:["ほし"]},
  {emoji:"🕊️",names:["はと"]},{emoji:"🦷",names:["は"]},{emoji:"🐑",names:["ひつじ"]},{emoji:"✈️",names:["ひこうき"]},{emoji:"🎈",names:["ふうせん"]},{emoji:"📖",names:["ほん"]},{emoji:"🔥",names:["ほのお"]},
  {emoji:"🫘",names:["まめ"]},{emoji:"🍊",names:["みかん"]},{emoji:"🐛",names:["むし"]},{emoji:"👓",names:["めがね"]},{emoji:"🍑",names:["もも"]},
  {emoji:"🪟",names:["まど"]},{emoji:"🍯",names:["はちみつ"]},{emoji:"🟣",names:["むらさき"]},{emoji:"🍈",names:["めろん"]},
  {emoji:"⛰️",names:["やま"]},{emoji:"⛄",names:["ゆき"]},{emoji:"🌃",names:["よる"]},
  {emoji:"🐐",names:["やぎ"]},{emoji:"💍",names:["ゆびわ"]},{emoji:"♨️",names:["ゆ"]},{emoji:"🧚",names:["ようせい"]},
  {emoji:"🦁",names:["らいおん"]},{emoji:"🍎",names:["りんご"]},{emoji:"💎",names:["るびー"]},{emoji:"🍋",names:["れもん"]},{emoji:"🕯️",names:["ろうそく"]},
  {emoji:"🍜",names:["らーめん"]},{emoji:"🎀",names:["りぼん"]},{emoji:"🐿️",names:["りす"]},{emoji:"🧱",names:["れんが"]},{emoji:"🤖",names:["ろぼっと"]},
  {emoji:"🐊",names:["わに"]},{emoji:"🍭",names:["わたあめ"]}
];
function nameMatches(it, kana){ return it.names.some(n => n.includes(kana)); }
const SPECIAL_Q = {
  "ゐ": { q:"『ゐ』は なんと 読む？（むかしの かな）", ans:"い", choices:["い","え","き","ゆ"] },
  "ゑ": { q:"『ゑ』は なんと 読む？（むかしの かな）", ans:"え", choices:["え","い","へ","せ"] },
  "を": { q:"『を』は なんと 読む？", ans:"お", choices:["お","わ","ろ","の"] }
};
const ALL_KANA = ["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ","た","ち","つ","て","と","な","に","ぬ","ね","の","は","ひ","ふ","へ","ほ","ま","み","む","め","も","や","ゆ","よ","ら","り","る","れ","ろ","わ","ゐ","ゑ","を"];
const KANA_POOL = ALL_KANA.filter(k => SPECIAL_Q[k] || ITEMS.some(it => nameMatches(it, k)));
function buildQuiz(kana){
  if(SPECIAL_Q[kana]){
    const s = SPECIAL_Q[kana];
    const opts = [...s.choices];
    for(let i=opts.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
    return { special:true, kana, q:s.q, tiles: opts.map(t => ({ text:t, correct: t===s.ans })) };
  }
  const cand = ITEMS.filter(it => nameMatches(it, kana));
  const correct = cand[Math.floor(Math.random()*cand.length)];
  const pool = ITEMS.filter(it => !nameMatches(it, kana));
  const ds = [];
  while(ds.length < 3){
    const it = pool[Math.floor(Math.random()*pool.length)];
    if(!ds.includes(it) && it !== correct) ds.push(it);
  }
  const tiles = [correct, ...ds].map(it => ({ emoji: it.emoji, name: it.names.join("／"), correct: it === correct }));
  for(let i=tiles.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [tiles[i],tiles[j]]=[tiles[j],tiles[i]]; }
  return { special:false, kana, q:"", tiles };
}

/* ---------- 音 ---------- */
let AC = null;
let bgmOn = localStorage.getItem("quiz_bgm") !== "0";
let seOn  = localStorage.getItem("quiz_se")  !== "0";
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === "suspended") AC.resume(); return AC; }
function tone(freq, t0, dur, type, vol, isBgm){
  const a = ac(), o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function seCorrect(){ if(!seOn) return; const t = ac().currentTime; [523,659,784,1047].forEach((f,i)=> tone(f, t + i*0.1, 0.34, "triangle", 0.2)); }
function seWrong(){ if(!seOn) return; const t = ac().currentTime; tone(330, t, 0.18, "sine", 0.12); tone(262, t + 0.14, 0.24, "sine", 0.12); }
function seTap(){ if(!seOn) return; tone(700, ac().currentTime, 0.08, "sine", 0.1); }
const PENTA = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3];
let bgmTimer = null, bgmStep = 0;
function bgmTick(){
  if(!bgmOn) return;
  const t = ac().currentTime + 0.05;
  const f = PENTA[[0,2,4,7,4,2,5,3][bgmStep % 8]];
  tone(f, t, 1.3, "sine", 0.05, true); tone(f * 2, t, 0.8, "sine", 0.018, true);
  if(bgmStep % 4 === 0) tone(130.8, t, 2.4, "sine", 0.04, true);
  bgmStep++; bgmTimer = setTimeout(bgmTick, 1080);
}
function bgmStart(){ if(bgmTimer || !bgmOn) return; bgmTick(); }
function bgmStop(){ clearTimeout(bgmTimer); bgmTimer = null; }
const bgmBtn = document.getElementById("bgmBtn"), seBtn = document.getElementById("seBtn");
const maskBtn = document.getElementById("maskBtn");
let maskOn = localStorage.getItem("quiz_mask") !== "0"; /* 既定オン（全部見えると簡単すぎるため） */
function syncBtns(){ bgmBtn.textContent = bgmOn ? "🎵 おんがく オン" : "🎵 おんがく オフ"; seBtn.textContent = seOn ? "🔔 おと オン" : "🔔 おと オフ"; maskBtn.textContent = maskOn ? "＊ ふせじ オン" : "＊ ふせじ オフ"; }
bgmBtn.addEventListener("click", ()=>{ bgmOn = !bgmOn; localStorage.setItem("quiz_bgm", bgmOn ? "1" : "0"); syncBtns(); if(bgmOn){ ac(); bgmStart(); } else bgmStop(); });
seBtn.addEventListener("click", ()=>{ seOn = !seOn; localStorage.setItem("quiz_se", seOn ? "1" : "0"); syncBtns(); if(seOn) seTap(); });
maskBtn.addEventListener("click", ()=>{ maskOn = !maskOn; localStorage.setItem("quiz_mask", maskOn ? "1" : "0"); syncBtns(); if(!locked && current) renderTiles(); });
syncBtns();
/* ふせじ：名前の1文字を ＊ にする。1文字の名前はそのまま。
   正解タイルでは「お題のかな」自体は隠さない（隠すと手がかりが消えて理不尽になるため） */
function maskName(joined, isCorrect, kana){
  if(!maskOn) return joined;
  const chars = [...joined];
  if(chars.length <= 1) return joined;
  const pos = [];
  chars.forEach((c, i) => {
    if(c === "／") return;
    if(isCorrect && c === kana) return;
    pos.push(i);
  });
  if(!pos.length) return joined;
  chars[pos[Math.floor(Math.random()*pos.length)]] = "＊";
  return chars.join("");
}
const fsBtn = document.getElementById("fsBtn");
function syncFsLabel(){ fsBtn.textContent = document.fullscreenElement ? "⛶ もどす" : "⛶ ぜんがめん"; }
fsBtn.addEventListener("click", ()=>{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else document.documentElement.requestFullscreen().catch(()=>{}); });
document.addEventListener("fullscreenchange", syncFsLabel);

/* ---------- ゲーム本体 ---------- */
const qText = document.getElementById("qText");
const tilesEl = document.getElementById("tiles");
const countNum = document.getElementById("countNum");
const bubble = document.getElementById("bubble");
const judge = document.getElementById("judge");
const announceEl = document.getElementById("announce");
let correctTotal = parseInt(localStorage.getItem("quiz_correct") || "0", 10) || 0;
/* 区切り：10問でリザルト画面（出口）。カウンタは今回の進み具合を表示 */
const SESSION = 10;
let sessionDone = 0, firstTry = 0, wrongsThisQ = 0;
countNum.textContent = "0";
let current = null, lastKana = "", locked = false;
const PRAISE = ["すごい！ せいかい！ 🎉", "やったね！ ⭕", "ばっちり！ 😊", "せいかい！ じょうずだね ⭐"];
const OSHII = ["おしい！", "ちがうみたい。もういちど！", "おしい！ よく見てみてね"];
let bubbleTimer = null;
function say(text, holdMs){
  bubble.textContent = text;
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(()=>{ bubble.textContent = "つぎは どれかな？ 😊"; }, holdMs || 3000);
}
function sparks(x, y, n){
  for(let i = 0; i < n; i++){
    const el = document.createElement("div");
    el.className = "spark"; el.textContent = i % 2 ? "⭐" : "✨";
    el.style.left = x + "px"; el.style.top = y + "px"; el.style.fontSize = (20 + Math.random()*16) + "px";
    const ang = (i / n) * 6.283, d = 60 + Math.random()*70;
    el.style.setProperty("--dx", Math.cos(ang)*d + "px");
    el.style.setProperty("--dy", Math.sin(ang)*d + "px");
    document.body.appendChild(el); setTimeout(()=> el.remove(), 850);
  }
}
function nextQuestion(){
  locked = false;
  wrongsThisQ = 0;
  let kana = KANA_POOL[Math.floor(Math.random()*KANA_POOL.length)];
  if(kana === lastKana) kana = KANA_POOL[(KANA_POOL.indexOf(kana) + 3) % KANA_POOL.length];
  lastKana = kana;
  current = buildQuiz(kana);
  if(current.special){
    qText.textContent = current.q;
  } else {
    qText.innerHTML = `<span class="bigKana">${kana}</span> が はいっている<br>ことばの 絵は どれ？`;
  }
  renderTiles();
}
function renderTiles(){
  tilesEl.innerHTML = "";
  current.tiles.forEach((t) => {
    const b = document.createElement("button");
    b.className = "tile" + (t.wrongFlag ? " wrong" : "");
    b.innerHTML = t.text !== undefined
      ? `<span class="txt">${t.text}</span>`
      : `<span class="emo">${t.emoji}</span><span class="nm">${maskName(t.name, t.correct, current.kana)}</span>`;
    b.addEventListener("click", ()=> answer(b, t));
    tilesEl.appendChild(b);
  });
}
function answer(btn, t){
  if(locked || btn.classList.contains("wrong")) return;
  ac(); bgmStart();
  if(!t.correct){
    wrongsThisQ++;
    t.wrongFlag = true;
    btn.classList.add("wrong", "shake");
    setTimeout(()=> btn.classList.remove("shake"), 320);
    seWrong();
    say(OSHII[Math.floor(Math.random()*OSHII.length)]);
    return;
  }
  locked = true;
  btn.classList.add("right");
  if(wrongsThisQ === 0) firstTry++;
  sessionDone++;
  countNum.textContent = String(sessionDone);
  correctTotal++;
  localStorage.setItem("quiz_correct", String(correctTotal));
  seCorrect();
  const r = btn.getBoundingClientRect();
  sparks(r.left + r.width/2, r.top + r.height/2, 10);
  judge.classList.remove("show"); void judge.offsetWidth; judge.classList.add("show");
  say(PRAISE[Math.floor(Math.random()*PRAISE.length)], 2100);
  if(sessionDone >= SESSION){
    setTimeout(showResult, 2100);
  } else {
    setTimeout(nextQuestion, 2000);
  }
}
/* リザルト画面（区切り・出口） */
const resultEl = document.getElementById("result");
function showResult(){
  document.getElementById("rFirst").textContent = String(firstTry);
  document.getElementById("rTotal").textContent = String(correctTotal);
  document.getElementById("rPraise").textContent =
    firstTry >= 10 ? "すごい！ ぜんぶ いっかいで あたった！ 🏆" :
    firstTry >= 7  ? "とても じょうずだね！ 🌟" :
    firstTry >= 4  ? "じょうずだね！ 😊" : "たのしく あそべたね！ 😊";
  resultEl.classList.add("show");
  seCorrect();
  say("おつかれさま！ 🎉", 3000);
}
document.getElementById("againBtn").addEventListener("click", ()=>{
  resultEl.classList.remove("show");
  sessionDone = 0; firstTry = 0;
  countNum.textContent = "0";
  nextQuestion();
});
/* 起動したら即1問目（画面遷移・選択なし） */
nextQuestion();
document.addEventListener("pointerdown", ()=>{ ac(); bgmStart(); }, { once:true });

/* 入口フェードイン */
requestAnimationFrame(()=>{ setTimeout(()=>{ const v = document.getElementById("fadeVeil"); v.style.transition = "opacity 1.6s ease"; v.style.opacity = "0"; }, 60); });

/* テスト・保守用フック */
window.__quiz = {
  get correct(){ return correctTotal; },
  get sessionDone(){ return sessionDone; },
  get firstTry(){ return firstTry; },
  get resultShown(){ return resultEl.classList.contains("show"); },
  again(){ document.getElementById("againBtn").click(); },
  get kana(){ return current ? current.kana : ""; },
  tiles(){ return [...tilesEl.children].map(b => ({ text: b.textContent.trim(), wrong: b.classList.contains("wrong") })); },
  answerIndex(){ return current ? current.tiles.findIndex(t => t.correct) : -1; },
  tap(i){ const b = tilesEl.children[i]; if(b) b.click(); },
  buildQuiz, KANA_POOL, maskName,
  get maskOn(){ return maskOn; },
  toggleMask(){ maskBtn.click(); },
  displayNames(){ return [...tilesEl.querySelectorAll(".nm")].map(el => el.textContent); },
};
</script>

<!-- 埋め込み（時計の窓の中）対応: 見た目はそのまま、戻るリンクの挙動だけ合図に変える -->
<style>html.embedded #fsBtn{ display:none !important; }</style>
<script>
if (window.self !== window.top) {
  document.documentElement.classList.add("embedded");
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href="index.html"]');
    if (a) { e.preventDefault(); parent.postMessage("closeGame", "*"); }
  });
}
</script>
