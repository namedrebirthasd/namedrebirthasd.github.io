<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ハンマーラン｜ナビちゃんの リズム たたき</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:linear-gradient(180deg,#bfe6ff 0%,#dff3ff 55%,#fdf6d8 100%);
    color:#23405a; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  /* 上部バー */
  #topbar{ position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:flex-start; gap:8px; padding:10px; pointer-events:none; }
  .tbtn{ pointer-events:auto; cursor:pointer; font-family:inherit; font-size:19px; font-weight:bold; color:#1d4a6b;
    background:#f2faff; border:3px solid #5b93b8; border-radius:999px; padding:10px 18px; box-shadow:0 3px 0 rgba(30,70,100,.35); }
  .tbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(30,70,100,.35); }
  #counter{ margin:0 auto; background:rgba(255,252,240,.96); border:4px solid #e88bb0; border-radius:999px;
    padding:8px 30px; font-size:clamp(24px,4.6vw,38px); font-weight:bold; color:#a03d63; box-shadow:0 4px 0 rgba(150,60,90,.3); white-space:nowrap; }

  /* ステージ */
  #stage{ position:fixed; inset:0; z-index:5; }
  #ground{ position:absolute; left:0; right:0; bottom:0; height:21%;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.85) 0 54px, transparent 54px 108px) 0 22px/108px 8px no-repeat,
      linear-gradient(180deg,#8a6a44 0%,#75572f 100%); }
  body.playing #ground{ animation:roadScroll .5s linear infinite; }
  @keyframes roadScroll{ from{ background-position:0 22px, 0 0; } to{ background-position:-108px 22px, 0 0; } }
  .cloud{ position:absolute; z-index:1; opacity:.85; pointer-events:none; line-height:1; }

  /* ナビちゃん（ランナー） */
  #naviWrap{ position:absolute; left:4.5%; bottom:19%; width:clamp(110px,19vmin,168px); z-index:6; pointer-events:none; }
  #naviWrap img{ width:100%; display:block; filter:drop-shadow(0 4px 4px rgba(40,60,20,.3)); }
  body.playing #naviWrap{ animation:runBob .24s ease-in-out infinite alternate; }
  @keyframes runBob{ from{ transform:translateY(0) rotate(-1.5deg);} to{ transform:translateY(-11px) rotate(1.5deg);} }
  #hammer{ position:absolute; right:-24%; top:26%; font-size:clamp(52px,9.5vmin,80px); line-height:1;
    transform:rotate(-28deg); transform-origin:20% 85%; filter:drop-shadow(0 3px 3px rgba(60,40,0,.4)); }

  /* たたくゾーン */
  #zone{ position:absolute; bottom:19.5%; width:clamp(104px,17vmin,140px); height:clamp(104px,17vmin,140px);
    border:7px solid #ffb52e; border-radius:50%; z-index:4; pointer-events:none;
    box-shadow:0 0 0 5px rgba(255,255,255,.65), inset 0 0 24px rgba(255,181,46,.35); }
  #zoneLabel{ position:absolute; bottom:calc(19.5% + clamp(112px,18.5vmin,150px)); transform:translateX(-50%);
    font-size:clamp(17px,2.8vmin,22px); font-weight:bold; color:#a86a00; white-space:nowrap; z-index:4; pointer-events:none;
    text-shadow:0 2px 0 rgba(255,255,255,.8); }

  /* ノーツ */
  #noteLayer{ position:absolute; inset:0; z-index:5; pointer-events:none; }
  .note{ position:absolute; bottom:20.5%; font-size:clamp(64px,11.5vmin,96px); line-height:1; will-change:transform;
    filter:drop-shadow(0 4px 4px rgba(40,50,20,.35)); }
  .note.gold{ filter:drop-shadow(0 0 16px gold) drop-shadow(0 4px 4px rgba(40,50,20,.35)); }
  .note.escaped{ opacity:.4; filter:grayscale(.7); }
  .note.splat{ transition:transform .18s, opacity .18s; transform:scale(1.3,.3) !important; opacity:.2; }
  .spark{ position:fixed; z-index:46; pointer-events:none; animation:sparkFly .8s ease-out forwards; }
  @keyframes sparkFly{ 0%{ transform:translate(0,0) scale(1); opacity:1; } 100%{ transform:translate(var(--dx),var(--dy)) scale(.4); opacity:0; } }

  /* ナビの吹き出し */
  #bubble{ position:fixed; left:14px; top:120px; z-index:20; max-width:min(56vw,400px);
    background:#fffdf4; border:3px solid #e8a13a; border-radius:16px; padding:10px 14px;
    font-size:clamp(19px,3vw,25px); font-weight:bold; color:#6b4423; line-height:1.5;
    box-shadow:0 4px 10px rgba(120,70,0,.25); opacity:0; transition:opacity .35s ease; pointer-events:none; }
  #bubble.show{ opacity:1; }

  /* タイトル画面 */
  #titleScr{ position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background:rgba(230,246,255,.55); }
  #titleScr.hide{ display:none; }
  .tcard{ background:#fffdf6; border:6px solid #5b93b8; border-radius:34px; padding:26px 44px 32px; text-align:center;
    box-shadow:0 14px 40px rgba(30,70,100,.35); max-width:min(94vw,600px); animation:cardIn .5s cubic-bezier(.2,1.5,.4,1); }
  @keyframes cardIn{ 0%{ transform:scale(.7); opacity:0;} 100%{ transform:scale(1); opacity:1;} }
  .tcard h1{ font-size:clamp(38px,7.4vw,58px); color:#12507e; margin-bottom:2px; }
  .tcard .sub{ font-size:clamp(20px,3.6vw,27px); font-weight:bold; color:#a03d63; margin-bottom:8px; }
  .tcard img{ width:clamp(110px,20vmin,160px); }
  .tcard p{ font-size:clamp(20px,3.6vw,26px); font-weight:bold; color:#44607a; line-height:1.65; margin:8px 0 16px; }
  #startBtn{ cursor:pointer; font-family:inherit; font-size:clamp(34px,6.4vw,48px); font-weight:bold; color:#fff;
    background:#ff8c42; border:5px solid #d96a1e; border-radius:999px; padding:16px 58px;
    box-shadow:0 7px 0 rgba(160,80,10,.55); animation:startPulse 1.1s ease-in-out infinite; }
  @keyframes startPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }
  #startBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(160,80,10,.55); }

  /* リザルト画面 */
  #result{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(240,249,255,.7); }
  #result.show{ display:flex; }
  .card{ background:#fffdf6; border:6px solid #5b93b8; border-radius:34px; padding:34px 44px; text-align:center;
    box-shadow:0 14px 40px rgba(30,70,100,.35); max-width:min(92vw,560px); animation:cardIn .5s cubic-bezier(.2,1.5,.4,1); }
  .card h2{ font-size:clamp(34px,6.4vw,50px); color:#12507e; margin-bottom:10px; }
  .card p{ font-size:clamp(22px,4vw,30px); font-weight:bold; color:#44607a; line-height:1.7; }
  .card .big{ font-size:clamp(40px,8vw,58px); color:#e0331f; }
  .rbtns{ display:flex; gap:14px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  .rbtn{ cursor:pointer; font-family:inherit; font-size:clamp(23px,4vw,30px); font-weight:bold; border-radius:999px; padding:14px 30px; }
  #againBtn{ background:#ff8c42; color:#fff; border:4px solid #d96a1e; box-shadow:0 5px 0 rgba(160,80,10,.5); }
  #againBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(160,80,10,.5); }
  #homeBtn{ background:#f2faff; color:#1d4a6b; border:4px solid #5b93b8; box-shadow:0 5px 0 rgba(30,70,100,.35); }
  #homeBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(30,70,100,.35); }

  #bottombar{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding:12px; pointer-events:none; }
  #backBtn{ pointer-events:auto; cursor:pointer; font-family:inherit; font-size:clamp(21px,3.6vw,27px); font-weight:bold;
    color:#1d4a6b; background:#f2faff; border:3px solid #5b93b8; border-radius:999px; padding:12px 30px; box-shadow:0 4px 0 rgba(30,70,100,.35); }
  #backBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(30,70,100,.35); }
</style>
</head>
<body>
<div id="topbar">
  <button class="tbtn" id="bgmBtn">🎵 おんがく オン</button>
  <button class="tbtn" id="seBtn">🔔 おと オン</button>
  <div id="counter">🎵 <span id="countNum">0</span> / 48</div>
  <button class="tbtn" id="fsBtn">⛶ ぜんがめん</button>
</div>

<div id="stage">
  <div id="ground"></div>
  <div id="zone"></div>
  <div id="zoneLabel">ここで タップ！</div>
  <div id="noteLayer"></div>
  <div id="naviWrap"><img id="naviImg" alt="ナビちゃん"><div id="hammer">🔨</div></div>
</div>
<div id="bubble"></div>
<div id="bottombar"><a href="index.html" id="backBtn" style="text-decoration:none;">🕐 とけいに もどる</a></div>

<div id="titleScr">
  <div class="tcard">
    <h1>🏃 ハンマーラン</h1>
    <div class="sub">ナビちゃんの リズム たたき</div>
    <img id="titleNavi" alt="ナビちゃん">
    <p>タコたちが おんがくに のって やってくるよ。<br>きいろい まるに きたら、タップして たたいてね！</p>
    <button id="startBtn">▶ スタート</button>
  </div>
</div>

<div id="result">
  <div class="card">
    <h2>🎉 ゴール！</h2>
    <p><span class="big" id="rHits">0</span> ひき たたけたよ！ 🐙<br>
    いままでに たたいたのは<br>
    ぜんぶで <span class="big" id="rTotal">0</span> ひき<br>
    <span id="rPraise">たのしかったね！ 😊</span></p>
    <div class="rbtns">
      <button class="rbtn" id="againBtn">▶ もういっかい</button>
      <button class="rbtn" id="homeBtn">🕐 とけいに もどる</button>
    </div>
  </div>
</div>

let AC = null;
let bgmOn = localStorage.getItem("hammer_bgm") !== "0";
let seOn  = localStorage.getItem("hammer_se")  !== "0";
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(freq, t0, dur, type, vol, slideTo){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, c.currentTime + t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + t0 + dur);
  g.gain.setValueAtTime(0.0001, c.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol, c.currentTime + t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
  o.connect(g); g.connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
}
function toneAt(freq, when, dur, type, vol){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(c.destination); o.start(when); o.stop(when + dur + 0.05);
}

  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq || 1200;
  const g = c.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(when);
}
function seHit(){ if(seOn){ noiseAt(AC.currentTime, .13, .45, 800); tone(150, 0, .16, "sine", .38, 55); tone(920, .02, .1, "triangle", .12); } }
function seGold(){ if(seOn){ [880,1174,1568].forEach((f,i)=> tone(f, i*.07, .18, "triangle", .15)); } }
function seWhiff(){ if(seOn){ tone(220, 0, .08, "sine", .05, 140); } }
function seGoal(){ if(seOn){ [523,659,784,1046,784,1046,1318,1568].forEach((f,i)=> tone(f, i*.11, .24, "triangle", .16)); } }
const bgmBtn = document.getElementById("bgmBtn");
const seBtn = document.getElementById("seBtn");
function paintBtns(){
  bgmBtn.textContent = bgmOn ? "🎵 おんがく オン" : "🎵 おんがく オフ";
  seBtn.textContent = seOn ? "🔔 おと オン" : "🔔 おと オフ";
}
bgmBtn.addEventListener("click", () => { bgmOn = !bgmOn; localStorage.setItem("hammer_bgm", bgmOn ? "1" : "0"); paintBtns(); });
seBtn.addEventListener("click", () => { seOn = !seOn; localStorage.setItem("hammer_se", seOn ? "1" : "0"); paintBtns(); if(seOn) seHit(); });
paintBtns();

/* フルスクリーン */
const inIframe = window.self !== window.top;
document.getElementById("fsBtn").addEventListener("click", () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});

/* ================= 画面要素 ================= */
const naviImg = document.getElementById("naviImg");
const titleNavi = document.getElementById("titleNavi");
naviImg.src = NAVI_SU; titleNavi.src = NAVI_WARAI;
const bubble = document.getElementById("bubble");
let bubbleTimer = null;
function say(text, ms){
  bubble.textContent = text;
  bubble.classList.add("show");
  if(bubbleTimer) clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove("show"), ms || 3000);
}
function sparks(x, y, n, emojis){
  for(let i = 0; i < (n || 10); i++){
    const s = document.createElement("span");
    s.className = "spark";
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.fontSize = (18 + Math.random()*22) + "px";
    const ang = Math.random()*Math.PI*2, dist = 60 + Math.random()*110;
    s.style.setProperty("--dx", Math.cos(ang)*dist + "px");
    s.style.setProperty("--dy", (Math.sin(ang)*dist - 40) + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 850);
  }
}
/* 雲 */
(function clouds(){
  const stage = document.getElementById("stage");
  ["☁️","☁️","🕊️","☁️","☁️"].forEach((emo, i) => {
    const s = document.createElement("span");
    s.className = "cloud"; s.textContent = emo;
    s.style.fontSize = (30 + Math.random()*36) + "px";
    s.style.top = (3 + Math.random()*22) + "%";
    s.style.opacity = (0.5 + Math.random()*0.35).toFixed(2);
    stage.appendChild(s);
    const dur = 60000 + Math.random()*50000;
    const W = window.innerWidth;
    s.animate([
      { transform: `translateX(${-120}px)` },
      { transform: `translateX(${W + 120}px)` }
    ], { duration: dur, iterations: Infinity, delay: -Math.random()*dur, easing: "linear" });
  });
})();

/* ================= 譜面と音楽 ================= */
const BPM = 110;
const BEAT = 60 / BPM;
const TRAVEL = BEAT * 4;         /* ノーツが流れる時間（4拍） */
const HITWIN = 0.30;             /* 判定の広さ（秒）± */
const NOTE_EMOS = ["🐙","🦑","🐡","🦀","🐠","🐙","🦐","🐙"];
const GAPS = [2,2,2,2, 2,2,1,2, 2,1,2,2, 1,2,2,1, 2,2,1,1, 2,1,2,2, 1,1,2,1, 2,1,1,2, 1,2,1,1, 2,1,2,1, 1,2,1,2, 2,1,1,1, 2];
const chart = [];
(function buildChart(){
  let b = 2;
  GAPS.forEach((g, i) => {
    chart.push({ beat: b, emo: NOTE_EMOS[i % NOTE_EMOS.length], gold: Math.random() < 0.06, hit: false, escaped: false, el: null, hitTime: 0 });
    b += g;
  });
})();
const LAST_BEAT = chart[chart.length - 1].beat;
/* 曲：16ステップ（2小節）ループ */
const MEL = [523,0,659,0, 784,0,659,0, 880,0,784,659, 587,0,494,0];
const BASS = [131,196,165,220];
let songStart = 0, schedTimer = null, nextStep = 0, timeShift = 0;
function now(){ return ac() ? AC.currentTime + timeShift : 0; }
function scheduleStep(step, when){
  if(bgmOn){
    const m = MEL[step % 16];
    if(m) toneAt(m, when, .22, "triangle", .11);
    if(step % 4 === 0) toneAt(BASS[(step/4|0) % 4], when, .4, "sine", .14);
    if(step % 8 === 0) toneAt(75, when, .18, "sine", .5);
    if(step % 8 === 4) noiseAt(when, .09, .14, 1800);
    if(step % 2 === 1) noiseAt(when, .03, .05, 6000);
  }
}
function scheduler(){
  const ahead = now() + 0.15;
  while(songStart + nextStep * (BEAT/2) < ahead){
    const when = songStart + nextStep * (BEAT/2);
    if(when >= now() - 0.05) scheduleStep(nextStep, when - timeShift);
    nextStep++;
    if(nextStep * (BEAT/2) > (LAST_BEAT + 8) * BEAT) { clearInterval(schedTimer); schedTimer = null; break; }
  }
}

/* ================= ゲーム進行 ================= */
const noteLayer = document.getElementById("noteLayer");
const zoneEl = document.getElementById("zone");
const zoneLabel = document.getElementById("zoneLabel");
const countNum = document.getElementById("countNum");
const hammerEl = document.getElementById("hammer");
let playing = false, hits = 0, rafId = null;
let totalHits = parseInt(localStorage.getItem("hammer_total") || "0", 10) || 0;
function zoneX(){ return window.innerWidth * 0.30; }
function spawnX(){ return window.innerWidth + 90; }
function layoutZone(){
  const zx = zoneX(), z = zoneEl.getBoundingClientRect();
  zoneEl.style.left = (zx - z.width/2) + "px";
  zoneLabel.style.left = zx + "px";
}
window.addEventListener("resize", layoutZone);
function startGame(){
  ac();
  document.getElementById("titleScr").classList.add("hide");
  chart.forEach(n => { n.hit = false; n.escaped = false; if(n.el){ n.el.remove(); n.el = null; } });
  hits = 0; countNum.textContent = "0";
  naviImg.src = NAVI_SU;
  songStart = now() + 0.6;
  chart.forEach(n => { n.hitTime = songStart + n.beat * BEAT; });
  nextStep = 0; timeShift = 0;
  if(schedTimer) clearInterval(schedTimer);
  schedTimer = setInterval(scheduler, 25);
  playing = true;
  document.body.classList.add("playing");
  layoutZone();
  say("タコが まるに きたら タップしてね！", 3200);
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
}
function tick(){
  if(!playing) return;
  const t = now();
  const zx = zoneX(), sx = spawnX();
  const pxPerSec = (sx - zx) / TRAVEL;
  chart.forEach(n => {
    if(n.hit) return;
    if(!n.el){
      if(t >= n.hitTime - TRAVEL){
        const el = document.createElement("span");
        el.className = "note" + (n.gold ? " gold" : "");
        el.textContent = n.emo;
        noteLayer.appendChild(el);
        n.el = el;
      } else return;
    }
    const x = zx + (n.hitTime - t) * pxPerSec;
    n.el.style.transform = `translateX(${x - 40}px)`;
    if(!n.escaped && t > n.hitTime + HITWIN){
      n.escaped = true;
      n.el.classList.add("escaped");
    }
    if(x < -140){ n.el.remove(); n.el = null; n.escaped = true; }
  });
  if(t > songStart + (LAST_BEAT + 3) * BEAT){ finish(); return; }
  rafId = requestAnimationFrame(tick);
}
let swinging = false;
function swing(){
  if(!playing || swinging) return;
  swinging = true;
  hammerEl.animate([
    { transform: "rotate(-28deg)" },
    { transform: "rotate(62deg)", offset: 0.35 },
    { transform: "rotate(-28deg)" }
  ], { duration: 230, easing: "ease-out" }).onfinish = () => { swinging = false; };
  const t = now();
  let best = null, bestDt = 1e9;
  chart.forEach(n => {
    if(n.hit || n.escaped || !n.el) return;
    const dt = Math.abs(t - n.hitTime);
    if(dt <= HITWIN && dt < bestDt){ best = n; bestDt = dt; }
  });
  if(best){
    best.hit = true;
    hits++;
    totalHits++;
    localStorage.setItem("hammer_total", String(totalHits));
    countNum.textContent = String(hits);
    const r = best.el.getBoundingClientRect();
    sparks(r.left + r.width/2, r.top + r.height/2, best.gold ? 16 : 11, best.gold ? ["✨","⭐","💛"] : ["💥","⭐","✨"]);
    best.el.classList.add("splat");
    const el = best.el; best.el = null;
    setTimeout(() => el.remove(), 200);
    if(best.gold){ seGold(); say("きんの タコ！ ✨", 1500); } else seHit();
    if(hits === 12) say("いい ちょうし！ 🎵", 1800);
    if(hits === 24) say("はんぶん きたよ！ その ちょうし！", 1800);
    if(hits === 36) say("あと すこし！ がんばれー！", 1800);
  } else {
    seWhiff();
  }
}
document.getElementById("stage").addEventListener("pointerdown", swing);
const resultEl = document.getElementById("result");
function finish(){
  playing = false;
  document.body.classList.remove("playing");
  if(rafId) cancelAnimationFrame(rafId);
  if(schedTimer){ clearInterval(schedTimer); schedTimer = null; }
  seGoal();
  naviImg.src = NAVI_WARAI;
  document.getElementById("rHits").textContent = String(hits);
  document.getElementById("rTotal").textContent = String(totalHits);
  document.getElementById("rPraise").textContent =
    hits >= 44 ? "すごい！ リズム かんぺき！ 🏆" :
    hits >= 34 ? "とても じょうず！ 🌟" :
    hits >= 20 ? "じょうずに たたけたね！ 😊" : "たのしく たたけたね！ 😊";
  sparks(window.innerWidth/2, window.innerHeight/2, 26, ["🎉","⭐","✨","🎵"]);
  setTimeout(() => resultEl.classList.add("show"), 700);
}
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("againBtn").addEventListener("click", () => {
  resultEl.classList.remove("show");
  document.getElementById("titleScr").classList.remove("hide");
  naviImg.src = NAVI_SU;
});
function goHome(){
  if(inIframe) parent.postMessage("closeGame", "*");
  else location.href = "index.html";
}
document.getElementById("homeBtn").addEventListener("click", goHome);
const backBtn = document.getElementById("backBtn");
if(inIframe){
  backBtn.addEventListener("click", (e) => { e.preventDefault(); goHome(); });
}
layoutZone();
window.__hammer = {
  get hits(){ return hits; },
  get playing(){ return playing; },
  get total(){ return totalHits; },
  get notesOnScreen(){ return noteLayer.children.length; },
  start(){ startGame(); },
  swing(){ swing(); },
  resultShown(){ return resultEl.classList.contains("show"); },
  skipToEnd(){ timeShift = (songStart + (LAST_BEAT + 4) * BEAT) - now() + 0.1; }
};
</script>
