<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>さんすうクイズ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    background:linear-gradient(#eafbee 0%, #d3f2dc 55%, #bfe8cc 100%);
  }
  /* 上部バー */
  #topbar{ position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:flex-start; gap:8px; padding:10px; pointer-events:none; }
  .tbtn{ pointer-events:auto; cursor:pointer; font-family:inherit; font-size:19px; font-weight:bold; color:#1d5c38;
    background:#f4fff7; border:3px solid #4da56b; border-radius:999px; padding:10px 18px; box-shadow:0 3px 0 rgba(25,80,45,.35); }
  .tbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(25,80,45,.35); }
  #counter{ margin:0 auto; background:rgba(255,252,240,.96); border:4px solid #e88bb0; border-radius:999px;
    padding:8px 30px; font-size:clamp(24px,4.6vw,38px); font-weight:bold; color:#a03d63; box-shadow:0 4px 0 rgba(150,60,90,.3); white-space:nowrap; }

  /* 問題 */
  #qArea{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; padding:100px 16px 96px; }
  #qText{ font-size:clamp(24px,4.6vw,38px); font-weight:bold; color:#1d5c38; text-align:center; line-height:1.45;
    background:rgba(255,255,255,.88); border:4px solid #4da56b; border-radius:26px; padding:10px 26px; box-shadow:0 4px 0 rgba(25,80,45,.25); }
  /* 計算式のカード */
  #qCard{ font-size:clamp(56px,11vw,92px); font-weight:bold; color:#14402a; line-height:1.2; text-align:center;
    background:#fff; border:6px solid #6fbf87; border-radius:30px; padding:6px 36px; margin-top:10px;
    box-shadow:0 6px 0 rgba(40,110,65,.3); letter-spacing:.04em; }
  /* 数える問題の物置き場（タップで印が付く＝数え間違い防止） */
  #objBox{ margin-top:10px; background:rgba(255,255,255,.85); border:5px solid #6fbf87; border-radius:30px;
    padding:12px 18px; max-width:min(92vw, 600px); display:none; flex-wrap:wrap; justify-content:center; gap:8px 12px;
    box-shadow:0 6px 0 rgba(40,110,65,.25); }
  #objBox.show{ display:flex; }
  .objItem{ position:relative; font-size:clamp(40px,7vw,56px); line-height:1.15; cursor:pointer; border-radius:18px; padding:2px 6px; }
  .objItem.marked{ background:#ffe3ee; box-shadow:inset 0 0 0 4px #ff8fab; }
  .objItem .num{ position:absolute; top:-10px; right:-8px; background:#ff5b8a; color:#fff; border-radius:50%;
    width:30px; height:30px; font-size:19px; font-weight:bold; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 0 rgba(150,40,80,.4); }

  /* 選択肢タイル（2×2・特大） */
  #tiles{ margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(92vw, 640px); }
  .tile{ cursor:pointer; font-family:inherit; background:#fff; border:5px solid #6fbf87; border-radius:30px;
    display:flex; align-items:center; justify-content:center; padding:10px;
    box-shadow:0 6px 0 rgba(40,110,65,.3); transition:opacity .4s ease, transform .15s ease; }
  .tile:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(40,110,65,.3); }
  .tile .txt{ font-size:clamp(38px,8vw,60px); font-weight:bold; color:#27543a; line-height:1.2; }
  /* 背の低い画面ではさらに詰める（選択肢と「もどる」を絶対に被らせない） */
  @media (max-height:700px){
    #qArea{ padding-top:100px; }
    #qText{ font-size:26px; }
    #qCard{ font-size:64px; }
    .objItem{ font-size:44px; }
    .tile .txt{ font-size:40px; }
  }
  .tile.wrong{ opacity:.28; pointer-events:none; filter:grayscale(.6); }
  .tile.right{ border-color:#ff8fab; background:#fff0f5; animation:rightPop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes rightPop{ 0%{ transform:scale(.92);} 60%{ transform:scale(1.06);} 100%{ transform:scale(1);} }
  @keyframes shake{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-7px);} 75%{ transform:translateX(7px);} }
  .tile.shake{ animation:shake .3s ease; }

  /* 大きな ⭕ */
  #judge{ position:fixed; inset:0; z-index:45; display:flex; align-items:center; justify-content:center; pointer-events:none;
    font-size:min(62vw, 430px); opacity:0; transform:scale(.4); }
  #judge.show{ animation:judgePop 1s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes judgePop{ 0%{ opacity:0; transform:scale(.4);} 30%{ opacity:1; transform:scale(1.08);} 45%{ transform:scale(1);} 80%{ opacity:1;} 100%{ opacity:0; transform:scale(1.02);} }
  .spark{ position:fixed; z-index:46; pointer-events:none; animation:sparkFly .8s ease-out forwards; }
  @keyframes sparkFly{ from{ transform:translate(-50%,-50%) scale(1); opacity:1;} to{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3); opacity:0;} }

  /* ナビちゃん */
  #choco{ position:fixed; left:10px; bottom:86px; z-index:20; width:clamp(96px,17vw,150px); pointer-events:none; }
  #choco img{ width:100%; display:block; }
  #bubble{ position:fixed; left:14px; bottom:calc(86px + clamp(96px,17vw,150px) + 6px); z-index:20; max-width:min(44vw,320px);
    background:#fff; border:4px solid #f0b429; border-radius:20px; padding:12px 18px;
    font-size:clamp(19px,3.4vw,27px); font-weight:bold; color:#5a4512; box-shadow:0 4px 0 rgba(140,90,20,.3);
    pointer-events:none; transition:opacity .6s ease; }
  #bubble.faded{ opacity:0; }
  #bubble:after{ content:""; position:absolute; left:44px; bottom:-16px; border:8px solid transparent; border-top:10px solid #f0b429; }
  /* 背の低い画面：吹き出しを細くして、選択肢の数字の左端を隠さない（8が3に見える事故の防止） */
  @media (max-height:700px){ #bubble{ max-width:260px; font-size:19px; } }

  #fadeVeil{ position:fixed; inset:0; z-index:35; background:#fff; opacity:0; pointer-events:none; transition:opacity .8s ease; }

  /* リザルト */
  #result{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(211,242,220,.85); padding:18px; }
  #result.show{ display:flex; }
  #result .card{ background:#fff; border:6px solid #6fbf87; border-radius:34px; padding:30px 40px; text-align:center;
    max-width:min(92vw, 620px); box-shadow:0 12px 34px rgba(25,80,45,.35); }
  #result .rbig{ font-size:clamp(38px,7.5vw,62px); font-weight:bold; color:#d6336c; }
  #result .rline{ margin-top:8px; font-size:clamp(24px,4.6vw,36px); font-weight:bold; color:#1d5c38; }
  #result .rscore{ margin-top:16px; font-size:clamp(26px,5vw,40px); font-weight:bold; color:#a03d63;
    background:#fff0f5; border:3px dashed #ff8fab; border-radius:20px; padding:10px 16px; }
  #result .rpraise{ margin-top:12px; font-size:clamp(22px,4.2vw,32px); font-weight:bold; color:#b57708; }
  #result .rtotal{ margin-top:10px; font-size:clamp(18px,3.4vw,24px); font-weight:bold; color:#8a6d3b; }
  #result .rbtns{ margin-top:22px; display:flex; flex-direction:column; gap:14px; align-items:center; }
  #againBtn{ cursor:pointer; font-family:inherit; font-size:clamp(24px,4.6vw,34px); font-weight:bold; color:#fff;
    background:#ff7aa2; border:4px solid #e75480; border-radius:999px; padding:14px 38px; box-shadow:0 5px 0 rgba(170,50,90,.4); }
  #againBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(170,50,90,.4); }
  #rBack{ text-decoration:none; font-size:clamp(22px,4vw,30px); font-weight:bold; color:#20506e;
    background:#dceefb; border:4px solid #7db3dd; border-radius:999px; padding:12px 34px; box-shadow:0 5px 0 rgba(40,90,130,.35); }

  /* 下部 */
  #bottombar{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding:12px; pointer-events:none; }
  a.backbtn{ pointer-events:auto; text-decoration:none; font-size:clamp(22px,4vw,30px); font-weight:bold; color:#20506e;
    background:#dceefb; border:4px solid #7db3dd; border-radius:999px; padding:14px 34px; box-shadow:0 5px 0 rgba(40,90,130,.35); }
  a.backbtn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(40,90,130,.35); }
</style>
</head>
<body>
<div id="topbar">
  <button class="tbtn" id="bgmBtn">🎵 おんがく オン</button>
  <button class="tbtn" id="seBtn">🔔 おと オン</button>
  <div id="counter">⭐ <span id="countNum">0</span> / 10 もん</div>
  <button class="tbtn" id="fsBtn">⛶ ぜんがめん</button>
</div>

<div id="qArea">
  <div id="qText">いくつ ある？</div>
  <div id="qCard" style="display:none"></div>
  <div id="objBox"></div>
  <div id="tiles"></div>
</div>

<div id="bubble">かずの クイズだよ！😊</div>
<div id="choco"><img id="naviImg" src="character.png" alt="" onerror="this.parentNode.style.display='none'"></div>

<div id="judge">⭕</div>
<div id="fadeVeil" style="opacity:1"></div>

<!-- リザルト（10問で区切り：出口） -->
<div id="result">
  <div class="card">
    <div class="rbig">🎉 おつかれさま！</div>
    <div class="rline">10もん おわったよ</div>
    <div class="rscore">いっかいで あたった ⭐ <span id="rFirst">0</span> もん</div>
    <div class="rpraise" id="rPraise"></div>
    <div class="rtotal">ぜんぶで ⭐ <span id="rTotal">0</span> もん せいかい</div>
    <div class="rbtns">
      <button id="againBtn">▶ もういちど あそぶ</button>
      <a id="rBack" href="index.html">🕐 とけいに もどる</a>
    </div>
  </div>
</div>

<div id="bottombar"><a class="backbtn" href="index.html">🕐 とけいに もどる</a></div>

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));

/* 選択肢：正解の近くから3つ（重複なし・0以上） */
function makeOpts(ans){
  const set = new Set([ans]);
  const cand = shuffle([ans-2, ans-1, ans+1, ans+2, ans+10, ans-10, ans+3, ans-3].filter(v => v >= 0));
  for(const c of cand){ if(set.size >= 4) break; set.add(c); }
  let extra = ans + 4;
  while(set.size < 4){ set.add(extra++); }
  return shuffle([...set]);
}
/* 問題生成：数える4問＋たし算3問＋ひき算3問＝10問 */
const COUNT_EMOS = ["🍎","🍊","🍓","🍌","🍇","🌷","🐠","🍬","⭐","🍪"];
function buildRound(){
  const qs = [];
  for(let i = 0; i < 4; i++){
    const n = ri(2, 10);
    qs.push({ type:"count", emo: COUNT_EMOS[ri(0, COUNT_EMOS.length-1)], n, ans: n, opts: makeOpts(n) });
  }
  /* たし算・ひき算は2けた（2026-11-23 格上げ：1けたは易しすぎて「しょうもない」と言われた） */
  for(let i = 0; i < 3; i++){
    let a, b;
    do { a = ri(14, 79); b = ri(5, 49); } while(a + b > 99);
    qs.push({ type:"add", a, b, ans: a + b, opts: makeOpts(a + b) });
  }
  for(let i = 0; i < 3; i++){
    let a, b;
    do { a = ri(28, 99); b = ri(6, a - 5); } while(a - b < 5);
    qs.push({ type:"sub", a, b, ans: a - b, opts: makeOpts(a - b) });
  }
  return shuffle(qs);
}

/* ---------- 音（他クイズと同一の仕組み） ---------- */
let AC = null;
let bgmOn = localStorage.getItem("sansuu_bgm") !== "0";
let seOn  = localStorage.getItem("sansuu_se")  !== "0";
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === "suspended") AC.resume(); return AC; }
function tone(freq, t0, dur, type, vol){
  const a = ac(), o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function seCorrect(){ if(!seOn) return; const t = ac().currentTime; [523,659,784,1047].forEach((f,i)=> tone(f, t + i*0.1, 0.34, "triangle", 0.2)); }
function seWrong(){ if(!seOn) return; const t = ac().currentTime; tone(330, t, 0.18, "sine", 0.12); tone(262, t + 0.14, 0.24, "sine", 0.12); }
function seTap(){ if(!seOn) return; tone(700, ac().currentTime, 0.08, "sine", 0.1); }
function seCount(n){ if(!seOn) return; tone(440 + n * 55, ac().currentTime, 0.16, "triangle", 0.16); }
const PENTA = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3, 659.3];
let bgmTimer = null, bgmStep = 0;
function bgmTick(){
  if(!bgmOn) return;
  const t = ac().currentTime + 0.05;
  const f = PENTA[[0,2,4,7,4,2,5,3][bgmStep % 8]];
  tone(f, t, 1.3, "sine", 0.05); tone(f * 2, t, 0.8, "sine", 0.018);
  if(bgmStep % 4 === 0) tone(130.8, t, 2.4, "sine", 0.04);
  bgmStep++; bgmTimer = setTimeout(bgmTick, 1080);
}
function bgmStart(){ if(bgmTimer || !bgmOn) return; bgmTick(); }
function bgmStop(){ clearTimeout(bgmTimer); bgmTimer = null; }
const bgmBtn = document.getElementById("bgmBtn"), seBtn = document.getElementById("seBtn");
function syncBtns(){ bgmBtn.textContent = bgmOn ? "🎵 おんがく オン" : "🎵 おんがく オフ"; seBtn.textContent = seOn ? "🔔 おと オン" : "🔔 おと オフ"; }
bgmBtn.addEventListener("click", ()=>{ bgmOn = !bgmOn; localStorage.setItem("sansuu_bgm", bgmOn ? "1" : "0"); syncBtns(); if(bgmOn){ ac(); bgmStart(); } else bgmStop(); });
seBtn.addEventListener("click", ()=>{ seOn = !seOn; localStorage.setItem("sansuu_se", seOn ? "1" : "0"); syncBtns(); if(seOn) seTap(); });

function sparks(x, y, n){
  for(let i = 0; i < n; i++){
    const el = document.createElement("div");
    el.className = "spark"; el.textContent = i % 2 ? "⭐" : "✨";
    el.style.left = x + "px"; el.style.top = y + "px"; el.style.fontSize = (20 + Math.random()*16) + "px";
    const ang = (i / n) * 6.283, d = 60 + Math.random()*70;
    el.style.setProperty("--dx", Math.cos(ang)*d + "px");
    el.style.setProperty("--dy", Math.sin(ang)*d + "px");
    document.body.appendChild(el); setTimeout(()=> el.remove(), 850);
  }
}
/* 数える問題：物タップで番号の印が付き、数えた順に音が上がる */
let markedOrder = [];
function renumberMarks(){
  markedOrder.forEach((el, i)=>{
    let num = el.querySelector(".num");
    if(!num){ num = document.createElement("span"); num.className = "num"; el.appendChild(num); }
    num.textContent = String(i + 1);
  });
}
function tapObj(el){
  if(locked) return;
  ac(); bgmStart();
  const idx = markedOrder.indexOf(el);
  if(idx >= 0){
    markedOrder.splice(idx, 1);
    el.classList.remove("marked");
    const num = el.querySelector(".num"); if(num) num.remove();
    seTap();
  } else {
    markedOrder.push(el);
    el.classList.add("marked");
    seCount(markedOrder.length);
  }
  renumberMarks();
}

      el.className = "objItem"; el.textContent = current.emo;
      el.addEventListener("click", ()=> tapObj(el));
      objBox.appendChild(el);
    }
  } else if(current.type === "add"){
    qText.textContent = "たし算だよ。あわせて いくつ？";
    qCard.textContent = current.a + " ＋ " + current.b + " ＝ ？";
    qCard.style.display = "";
  } else {
    qText.textContent = "ひき算だよ。のこりは いくつ？";
    qCard.textContent = current.a + " － " + current.b + " ＝ ？";
    qCard.style.display = "";
  }
  renderTiles();
}
function renderTiles(){
  tilesEl.innerHTML = "";
  current.opts.forEach((v) => {
    const b = document.createElement("button");
    b.className = "tile";
    b.innerHTML = `<span class="txt">${v}</span>`;
    b.addEventListener("click", ()=> answer(b, v));
    tilesEl.appendChild(b);
  });
}
function answerText(){
  if(current.type === "count") return `「${current.emo}」は ${current.ans}こ あったよ`;
  if(current.type === "add") return `${current.a} ＋ ${current.b} は ${current.ans} だよ`;
  return `${current.a} － ${current.b} は ${current.ans} だよ`;
}
function answer(btn, v){
  if(locked || btn.classList.contains("wrong")) return;
  ac(); bgmStart();
  if(v !== current.ans){
    wrongsThisQ++;
    btn.classList.add("wrong", "shake");
    setTimeout(()=> btn.classList.remove("shake"), 320);
    seWrong();
    setNavi(NAVI_TERE, 2200);
    say(OSHII[Math.floor(Math.random()*OSHII.length)]);
    return;
  }
  locked = true;
  btn.classList.add("right");
  if(wrongsThisQ === 0) firstTry++;
  sessionDone++;
  countNum.textContent = String(sessionDone);
  correctTotal++;
  localStorage.setItem("sansuu_correct", String(correctTotal));
  seCorrect();
  const r = btn.getBoundingClientRect();
  sparks(r.left + r.width/2, r.top + r.height/2, 10);
  judge.classList.remove("show"); void judge.offsetWidth; judge.classList.add("show");
  setNavi(NAVI_WARAI, 2600);
  say(`せいかい！ ${answerText()} 🎉`, 2600);
  qi++;
  if(sessionDone >= SESSION){
    setTimeout(showResult, 2100);
  } else {
    setTimeout(nextQuestion, 2000);
  }
}
/* リザルト画面（区切り・出口） */
const resultEl = document.getElementById("result");
function showResult(){
  document.getElementById("rFirst").textContent = String(firstTry);
  document.getElementById("rTotal").textContent = String(correctTotal);
  document.getElementById("rPraise").textContent =
    firstTry >= 10 ? "すごい！ ぜんぶ いっかいで あたった！ 🏆" :
    firstTry >= 7  ? "とても じょうずだね！ 🌟" :
    firstTry >= 4  ? "じょうずだね！ 😊" : "たのしく あそべたね！ 😊";
  resultEl.classList.add("show");
  seCorrect();
  say("おつかれさま！ 🎉", 3000);
}
document.getElementById("againBtn").addEventListener("click", ()=>{
  resultEl.classList.remove("show");
  round = buildRound(); qi = 0;
  sessionDone = 0; firstTry = 0;
  countNum.textContent = "0";
  nextQuestion();
});
/* 起動したら即1問目（画面遷移・選択なし） */
nextQuestion();
setTimeout(()=>{ bubble.classList.add("faded"); }, 4000);
document.addEventListener("pointerdown", ()=>{ ac(); bgmStart(); }, { once:true });

/* 入口フェードイン */
requestAnimationFrame(()=>{ setTimeout(()=>{ const v = document.getElementById("fadeVeil"); v.style.transition = "opacity 1.6s ease"; v.style.opacity = "0"; }, 60); });

/* テスト・保守用フック */
window.__sansuu = {
  get correct(){ return correctTotal; },
  get sessionDone(){ return sessionDone; },
  get firstTry(){ return firstTry; },
  get resultShown(){ return resultEl.classList.contains("show"); },
  again(){ document.getElementById("againBtn").click(); },
  get type(){ return current ? current.type : ""; },
  get ans(){ return current ? current.ans : null; },
  get marked(){ return markedOrder.length; },
  tiles(){ return [...tilesEl.children].map(b => ({ text: b.textContent.trim(), wrong: b.classList.contains("wrong") })); },
  answerIndex(){ return current ? current.opts.indexOf(current.ans) : -1; },
  tap(i){ const b = tilesEl.children[i]; if(b) b.click(); },
  tapObj(i){ const el = objBox.children[i]; if(el) el.click(); },
  objCount(){ return objBox.children.length; },
  buildRound,
};
</script>

<!-- 埋め込み（時計の窓の中）対応: 見た目はそのまま、戻るリンクの挙動だけ合図に変える -->
<style>html.embedded #fsBtn{ display:none !important; }</style>
<script>
if (window.self !== window.top) {
  document.documentElement.classList.add("embedded");
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href="index.html"]');
    if (a) { e.preventDefault(); parent.postMessage("closeGame", "*"); }
  });
}
</script>
