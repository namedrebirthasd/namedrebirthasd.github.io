<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>まいにち時計カレンダー</title>
<style>
  /* ============================================================
     デザイン設定（色を変えたい時はここだけ触ればOK）
     ============================================================ */
  :root{
    --ink:#3a2e4f;            /* 基本の文字色（濃い紫グレー：真っ黒より目に優しい） */
    --ink-soft:#6b5b8a;
    --paper:#fffdf7;          /* カードの白（真っ白ではなく温かい白） */
    --accent:#e85d75;         /* 予定ありのときのアクセント */
    --accent-bg:#fff0f2;
    --calm:#4a7fb5;
    --radius:28px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","メイリオ",sans-serif;
    color:var(--ink);
    /* 単色にしない：朝の空のような、やさしい斜めグラデーション */
    background:linear-gradient(160deg,#fdeeda 0%,#fdf6ec 34%,#e8f2fb 72%,#e3ecfa 100%);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    padding:14px;
  }

  /* ---------- 時計の「枠」 ---------- */
  .frame{
    position:relative;
    width:100%;height:100%;
    max-width:1180px;max-height:860px;
    background:var(--paper);
    border:10px solid #1e2a4a;                 /* 濃紺の枠（C案・2026-10-27採用） */
    border-radius:44px;
    box-shadow:0 18px 50px rgba(20,30,60,.35), inset 0 0 0 3px #c9a86a, inset 0 0 60px rgba(255,214,150,.18);  /* 内側の金縁 */
    display:flex;flex-direction:column;
    padding:clamp(14px,3.2vh,34px) clamp(16px,3.5vw,44px);
    overflow:hidden;
  }
  /* 枠の四隅のネジ（時計らしさの演出・装飾のみ） */
  .screw{position:absolute;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#f2e3bb,#c9a86a 70%);  /* 金縁に合わせた金色 */
    box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
  .screw.tl{top:12px;left:12px}.screw.tr{top:12px;right:12px}
  .screw.bl{bottom:12px;left:12px}.screw.br{bottom:12px;right:12px}

  /* ---------- 右上の小さなボタン（家族用） ---------- */
  .tools{position:absolute;top:16px;right:18px;display:flex;gap:8px;z-index:30}
  .tools-left{position:absolute;top:16px;left:18px;display:flex;gap:8px;z-index:30}
  .tools-left button{
    font-family:inherit;font-size:15px;font-weight:700;color:var(--ink-soft);
    background:rgba(255,255,255,.85);border:2px solid #ddd2ba;border-radius:999px;
    padding:8px 14px;cursor:pointer;box-shadow:0 2px 6px rgba(90,64,32,.15);
  }
  .tools-left button:active{transform:scale(.96)}
  .tools button{
    font-family:inherit;font-size:15px;font-weight:700;color:var(--ink-soft);
    background:rgba(255,255,255,.85);border:2px solid #ddd2ba;border-radius:999px;
    padding:8px 14px;cursor:pointer;box-shadow:0 2px 6px rgba(90,64,32,.15);
  }
  .tools button:active{transform:scale(.96)}

  /* ---------- 日付 ---------- */
  .date-row{
    display:flex;align-items:center;justify-content:center;gap:.35em;
    font-weight:800;letter-spacing:.04em;
    font-size:clamp(32px,6.5vh,58px);   /* 実機の空きに合わせて拡大（2026-10-27） */
    margin-top:clamp(2px,1vh,10px);
  }
  .date-row .youbi{
    display:inline-flex;align-items:center;gap:.25em;
    padding:.08em .45em;border-radius:999px;background:#f4efe2;border:2px solid #e3d8bf;
  }
  .date-row .youbi .icon{font-size:.95em;line-height:1}

  /* ---------- 時刻（いちばん大きく） ---------- */
  .clock-row{
    display:flex;align-items:stretch;justify-content:center;gap:clamp(10px,2vw,22px);
    margin-top:clamp(6px,1.6vh,16px);
  }
  .ampm{
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(22px,4.4vh,40px);font-weight:800;color:var(--calm);
    background:#eaf3fc;border:3px solid #c9def2;border-radius:18px;
    padding:0 clamp(10px,1.8vw,20px);
  }
  .clock{
    font-size:clamp(88px,21vh,200px);   /* 実機の空きに合わせて拡大（2026-10-27） */
    font-weight:800;line-height:1;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    background:#fbf8ef;border:3px solid #e7dcc0;border-radius:22px;
    padding:.04em .28em .1em;
    box-shadow:inset 0 2px 10px rgba(120,90,40,.08);
  }
  .clock .colon{color:var(--ink-soft)}

  /* ---------- 予定 ---------- */
  .plan-area{
    margin-top:clamp(12px,2.6vh,26px);
    text-align:center;
    flex:1;display:flex;flex-direction:column;justify-content:center;
  }
  .plan-label{
    align-self:center;
    font-size:clamp(20px,3.6vh,32px);font-weight:800;color:var(--ink-soft);
    background:#f4efe2;border:2px solid #e3d8bf;border-radius:12px;
    padding:.1em .7em;
  }
  .plan-label.tomorrow{color:#7a4b12;background:#fdf0d3;border-color:#ecd29a}
  .plan-main{
    margin-top:clamp(8px,1.8vh,16px);
    font-size:clamp(30px,6.4vh,58px);font-weight:800;line-height:1.3;
    padding:.35em .4em;border-radius:22px;
  }
  .plan-main{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .plan-main.pressing{filter:brightness(.96)}
  .plan-main.has-plan{background:var(--accent-bg);border:3px solid #f6c3cc;color:#a1263c}
  .plan-main.no-plan{background:#eef5ec;border:3px solid #cfdfc9;color:#44663c}
  .plan-sub{
    margin-top:clamp(6px,1.4vh,12px);
    font-size:clamp(15px,2.6vh,23px);font-weight:700;color:var(--ink-soft);
    min-height:1.4em; /* 文章が無い時もレイアウトが跳ねないように */
  }

  /* ---------- キャラクター（右下のマスコット） ---------- */
  .mascot{
    position:absolute;right:clamp(6px,2vw,26px);bottom:0;z-index:20;
    width:clamp(185px,42vh,375px); /* JSが動かない時の既定＝新「大」（旧・特大） */
    pointer-events:auto;cursor:pointer;
    /* 長押しをブラウザに奪われないための3点セット（ドラッグ・選択・コールアウト抑止） */
    touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
    /* 動きはCSSだけ（JSで毎フレーム動かさない＝軽い）。
       28秒のうち大半は「ゆらゆら待機」、一瞬だけ下に隠れて、ぴょんっと戻る */
    animation:mascot-life 28s ease-in-out infinite;
    transform-origin:bottom center;
    filter:drop-shadow(0 4px 6px rgba(60,40,20,.25));
  }
  .mascot img{width:100%;display:block;-webkit-user-drag:none}
  /* キャラのタップ反応（吹き出し＋小ジャンプ）。不要になれば
     このCSSと、HTMLの .mascot-bubble、末尾の MascotFeature ブロックを消せば外せる */
  .mascot-bubble{
    position:absolute;right:6%;bottom:calc(100% - 6px);z-index:21;
    max-width:9em;padding:.28em .65em;border-radius:999px;
    background:rgba(255,253,247,.96);border:3px solid #d9cba6;
    color:var(--ink);font-size:clamp(17px,3.2vh,28px);font-weight:800;line-height:1.25;
    text-align:center;white-space:nowrap;
    opacity:0;transform:translateY(8px) scale(.92);pointer-events:none;
    transition:opacity .18s ease,transform .18s ease;
    box-shadow:0 6px 16px rgba(90,64,32,.22);
  }
  .mascot-bubble.show{opacity:1;transform:translateY(0) scale(1)}
  .mascot.reacting img{animation:mascot-react .65s ease}
  @keyframes mascot-react{
    0%{transform:translateY(0) scale(1,1)}
    30%{transform:translateY(-9%) scale(.96,1.05) rotate(-2deg)}
    55%{transform:translateY(2%) scale(1.06,.92) rotate(1deg)}
    78%{transform:translateY(-4%) scale(.99,1.02)}
    100%{transform:translateY(0) scale(1,1)}
  }
  @keyframes mascot-life{
    0%,100% {transform:translateY(6%) rotate(0deg)}
    10%     {transform:translateY(2%) rotate(-1.2deg)}   /* ゆらゆら */
    20%     {transform:translateY(5%) rotate(1.2deg)}
    30%     {transform:translateY(2%) rotate(-1deg)}
    40%     {transform:translateY(6%) rotate(0deg)}
    46%     {transform:translateY(6%)}
    50%     {transform:translateY(88%)}                   /* すとんと隠れる */
    58%     {transform:translateY(88%)}                   /* しばらく隠れたまま */
    62%     {transform:translateY(-7%)}                   /* ぴょんっ！ */
    65%     {transform:translateY(4%)}                    /* 着地 */
    68%     {transform:translateY(0%)}
    78%     {transform:translateY(4%) rotate(1deg)}       /* またゆらゆら */
    90%     {transform:translateY(2%) rotate(-1deg)}
  }
  @media (prefers-reduced-motion: reduce){
    .mascot{animation:none;transform:translateY(6%)}
  }

  /* ---------- カレンダー（下から出る引き出し） ---------- */
  .drawer{
    position:absolute;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,253,247,.98);
    border-top:4px solid #d9cba6;border-radius:26px 26px 0 0;
    box-shadow:0 -12px 34px rgba(90,64,32,.25);
    padding:14px clamp(14px,3vw,34px) 20px;
    transform:translateY(105%);
    transition:transform .35s ease;
  }
  .drawer.open{transform:translateY(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .drawer-title{font-size:clamp(20px,3.4vh,28px);font-weight:800}
  .drawer-head button{
    font-family:inherit;font-size:16px;font-weight:700;color:var(--ink-soft);
    background:#f4efe2;border:2px solid #ddd2ba;border-radius:999px;padding:7px 16px;cursor:pointer;
  }
  table.cal{width:100%;border-collapse:separate;border-spacing:4px;text-align:center}
  table.cal th{font-size:clamp(14px,2.2vh,19px);color:var(--ink-soft);padding:2px 0}
  table.cal th.sun{color:#c2433f} table.cal th.sat{color:#c2433f}
  table.cal td.off{color:#c2433f} /* 土日・祝日は赤文字（予定のマルとは別） */
  table.cal td{
    font-size:clamp(16px,2.7vh,23px);font-weight:700;
    padding:.32em 0;border-radius:12px;background:#f7f3e8;position:relative;
  }
  table.cal td.dim{opacity:.32}
  table.cal td.has-plan::after{
    content:"";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
    width:.42em;height:.42em;border-radius:50%;background:#2e9e5b; /* 予定ありは緑マル（赤は祝日と誤認しやすいので使わない） */
  }
  table.cal td.today{background:var(--ink);color:#fff;outline:3px solid #f2b13c;outline-offset:1px}
  table.cal td.today.has-plan::after{background:#ffd166}
  .drawer-note{margin-top:8px;font-size:clamp(13px,2vh,17px);color:var(--ink-soft);font-weight:700;text-align:center}

  /* ---------- 家族用ヒント（左下・小さく） ---------- */
  .hint{
    position:absolute;left:20px;bottom:12px;z-index:5;
    font-size:12px;font-weight:700;color:var(--ink-soft);opacity:.65;
  }

  /* ---------- 予定の書きかえ（長押しで開く） ---------- */
  .modal-back{
    position:absolute;inset:0;z-index:60;display:none;
    background:rgba(58,46,79,.45);align-items:flex-start;justify-content:center;padding:4vh 18px 18px;  /* 上寄せ：ソフトウェアキーボードに被らないように（2026-10-27） */
  }
  .modal-back.open{display:flex}
  .modal{
    background:var(--paper);border-radius:24px;border:3px solid #d9cba6;
    box-shadow:0 16px 44px rgba(40,25,10,.35);
    width:min(560px,94%);padding:22px;text-align:center;
    max-height:56vh;overflow-y:auto;  /* キーボード表示時でもボタンまで辿れるように */
  }
  .modal-title{font-size:clamp(20px,3.4vh,27px);font-weight:800}
  .modal-date{margin-top:4px;font-size:clamp(15px,2.4vh,19px);font-weight:700;color:var(--ink-soft)}
  .modal input{
    margin-top:14px;width:100%;font-family:inherit;
    font-size:clamp(20px,3.6vh,28px);font-weight:800;color:var(--ink);text-align:center;
    padding:.45em .3em;border:3px solid #c9def2;border-radius:14px;background:#fbf8ef;outline:none;
  }
  .modal input:focus{border-color:var(--calm)}
  .modal-btns{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal-btns button{
    font-family:inherit;font-size:clamp(15px,2.6vh,19px);font-weight:800;cursor:pointer;
    border-radius:14px;padding:.7em .4em;border:2px solid #ddd2ba;background:#f4efe2;color:var(--ink);
  }
  .modal-btns button.primary{background:#4a7fb5;border-color:#4a7fb5;color:#fff}
  .modal-btns button.danger{background:#fdf0f0;border-color:#eec5c5;color:#a1263c}
  .modal-btns button:active{transform:scale(.97)}
  .modal-note{margin-top:12px;font-size:13px;font-weight:700;color:var(--ink-soft)}

  /* ---------- 小さなお知らせ（キャラのサイズ変更など） ---------- */
  .toast{
    position:absolute;left:50%;bottom:5%;transform:translateX(-50%) translateY(8px);z-index:55;
    background:rgba(58,46,79,.88);color:#fff;font-weight:800;
    font-size:clamp(15px,2.6vh,20px);padding:.45em 1.1em;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="frame">
  <span class="screw tl"></span><span class="screw tr"></span>
  <span class="screw bl"></span><span class="screw br"></span>

  <div class="tools-left">
    <button id="btnCal" type="button">📅 カレンダー</button>
  </div>
  <div class="tools">
    <button id="btnFull" type="button">⛶ 全画面</button>
  </div>

  <div class="date-row">
    <span id="dateText">----年--月--日</span>
    <span class="youbi"><span id="youbiText">-</span><span class="icon" id="youbiIcon">⚪</span></span>
  </div>

  <div class="clock-row">
    <div class="ampm" id="ampm">午前</div>
    <div class="clock"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span></div>
  </div>

  <div class="plan-area">
    <div class="plan-label" id="planLabel">本日は…</div>
    <div class="plan-main" id="planMain">…</div>
    <div class="plan-sub" id="planSub"></div>
  </div>

  <div class="mascot" id="mascot" aria-hidden="true"><div class="mascot-bubble" id="mascotBubble"></div><img id="mascotImg" alt="" draggable="false"></div>

  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="drawer-title" id="calTitle">----年--月</div>
      <button id="btnCloseCal" type="button">とじる ✕</button>
    </div>
    <div id="calBody"></div>
    <div class="drawer-note">緑の ● がついている日は予定があります ／ 赤い数字は土・日・祝日 ／ 金色のワクが「今日」です</div>
  </div>

  <div class="hint">家族用：予定を長押しで書きかえ ／ キャラをタップで反応・長押しで大きさ変更</div>
  <div class="toast" id="toast"></div>

  <div class="modal-back" id="editBack">
    <div class="modal">
      <div class="modal-title">予定を書きかえる</div>
      <div class="modal-date" id="editDate">----</div>
      <input id="editInput" type="text" autocomplete="off" placeholder="予定の名前">
      <div class="modal-btns">
        <button id="btnSaveDate" type="button" class="primary">この日だけ変更</button>
        <button id="btnSaveWeek" type="button">毎週この曜日を変更</button>
        <button id="btnNoPlan" type="button" class="danger">この日を予定なしに</button>
        <button id="btnCancelEdit" type="button">やめる</button>
      </div>
      <div class="modal-note">変更はこのタブレットに保存されます（元の設定ファイルは変わりません）</div>
    </div>
  </div>
</div>

<script>
/* ================================================================
   ★★★ ここだけ編集すればOK ★★★（Rebirth用・設定エリア）

   ■ 曜日ごとの予定
     キーは曜日です。 0=日曜 / 1=月曜 / 2=火曜 / 3=水曜 / 4=木曜 / 5=金曜 / 6=土曜
     予定がない日は "予定なし" と書いてください（この文字が判定に使われます）。
     予定の名前を書くと、画面では「○○○の日 です」と表示されます。

   ■ 特別な日だけの予定（病院など）
     SPECIAL_DATES に "年-月-日": "予定の名前" を足すと、その日だけ優先されます。
     例） "2026-11-10": "病院",
     使わない行は消しても、そのままにしても大丈夫です。

   ■ 切り替え時刻
     SWITCH_HOUR = 17  → 17:00から「明日は…」表示に切り替わります。

   ■ 画面からの書きかえ（長押し編集）について
     タブレット上で予定を長押しして書きかえた内容は、その端末の中に保存され、
     ここの設定より優先されます（優先順位は planFor のコメント参照）。
     端末側の書きかえを全部消したい時は、ブラウザのサイトデータ削除で消えます。
   ================================================================ */
const SCHEDULE = {
  0: "予定なし",          // 日
  1: "予定なし",          // 月
  2: "たのしいデイたなべ", // 火
  3: "予定なし",          // 水
  4: "予定なし",          // 木
  5: "たのしいデイたなべ", // 金
  6: "たのしいデイたなべ"  // 土
};
const SPECIAL_DATES = {
  // "2026-11-10": "病院",
};
const SWITCH_HOUR = 17;
const NO_PLAN = "予定なし";
/* ================= 設定エリア ここまで ================= */


/* 曜日のアイコン（設計書どおり：月=白 / 火=赤 / 水=青 / 木=緑 / 金=黄 / 土=土星 / 日=太陽）
   配列は getDay() の順（0=日 … 6=土） */
const WEEK = [
  { name:"日", icon:"☀️" },  // 日：太陽
  { name:"月", icon:"⚪" },  // 月：白
  { name:"火", icon:"🔴" },  // 火：赤
  { name:"水", icon:"🔵" },  // 水：青
  { name:"木", icon:"🟢" },  // 木：緑
  { name:"金", icon:"🟡" },  // 金：黄
  { name:"土", icon:"🪐" }   // 土：土星
];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");

function dateKey(date){
  return date.getFullYear() + "-" + pad(date.getMonth()+1) + "-" + pad(date.getDate());
}

/* ---- 長押し編集の保存先（このタブレットのブラウザ内に保存される） ---- */
function loadJSON(key){
  try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch(e) { return {}; }
}
function saveJSON(key, obj){
  try { localStorage.setItem(key, JSON.stringify(obj)); } catch(e) {}
}
let DATE_OVERRIDES = loadJSON("elderCal_dateOverrides");  // { "2026-11-10": "病院" }
let WEEK_OVERRIDES  = loadJSON("elderCal_weekOverrides"); // { "2": "病院" } キーは曜日番号

/* 優先順位：「その日だけ」の長押し編集 ＞ ファイル内の特別日 ＞「毎週」の長押し編集 ＞ 通常の曜日予定 */
function planFor(date){
  const key = dateKey(date);
  if (Object.prototype.hasOwnProperty.call(DATE_OVERRIDES, key)) return DATE_OVERRIDES[key];
  if (Object.prototype.hasOwnProperty.call(SPECIAL_DATES, key)) return SPECIAL_DATES[key];
  const dow = String(date.getDay());
  if (Object.prototype.hasOwnProperty.call(WEEK_OVERRIDES, dow)) return WEEK_OVERRIDES[dow];
  return SCHEDULE[date.getDay()] || NO_PLAN;
}

/* ================= 日本の祝日（振替休日・国民の休日つき） ================= */
const holidayCache = {};
function holidaysOf(year){
  if (holidayCache[year]) return holidayCache[year];
  const set = new Set();
  const add = (m, d) => set.add(m + "-" + d);
  const nthMonday = (m, n) => { const dow = new Date(year, m-1, 1).getDay(); return 1 + ((8 - dow) % 7) + (n-1)*7; };
  add(1, 1);                 // 元日
  add(1, nthMonday(1, 2));   // 成人の日
  add(2, 11);                // 建国記念の日
  add(2, 23);                // 天皇誕生日
  add(3, Math.floor(20.8431 + 0.242194*(year-1980)) - Math.floor((year-1980)/4)); // 春分の日（1980〜2099の近似式）
  add(4, 29);                // 昭和の日
  add(5, 3); add(5, 4); add(5, 5); // 憲法記念日・みどりの日・こどもの日
  add(7, nthMonday(7, 3));   // 海の日
  add(8, 11);                // 山の日
  add(9, nthMonday(9, 3));   // 敬老の日
  add(9, Math.floor(23.2488 + 0.242194*(year-1980)) - Math.floor((year-1980)/4)); // 秋分の日
  add(10, nthMonday(10, 2)); // スポーツの日
  add(11, 3);                // 文化の日
  add(11, 23);               // 勤労感謝の日
  /* 振替休日：祝日が日曜なら、直後の平日（祝日でない日）を休みに */
  [...set].forEach(k => {
    const [m, d] = k.split("-").map(Number);
    if (new Date(year, m-1, d).getDay() === 0) {
      let t = new Date(year, m-1, d);
      do { t.setDate(t.getDate() + 1); } while (set.has((t.getMonth()+1) + "-" + t.getDate()));
      if (t.getFullYear() === year) set.add((t.getMonth()+1) + "-" + t.getDate());
    }
  });
  /* 国民の休日：平日が祝日に挟まれたら休み */
  for (let m = 1; m <= 12; m++) {
    const dim = new Date(year, m, 0).getDate();
    for (let d = 2; d < dim; d++) {
      const dt = new Date(year, m-1, d);
      if (dt.getDay() === 0 || dt.getDay() === 6) continue;
      if (!set.has(m + "-" + d) && set.has(m + "-" + (d-1)) && set.has(m + "-" + (d+1)))
        set.add(m + "-" + d);
    }
  }
  holidayCache[year] = set;
  return set;
}
function isHoliday(date){
  return holidaysOf(date.getFullYear()).has((date.getMonth()+1) + "-" + date.getDate());
}
function isOffDay(date){ /* 土・日・祝日＝赤文字にする日 */
  return date.getDay() === 0 || date.getDay() === 6 || isHoliday(date);
}

let lastMinuteKey = "";
let lastDayKey = "";
let currentTarget = null;   /* いま画面に表示している予定の対象日（長押し編集で使う） */
let currentPlanName = "";   /* いま表示している予定の名前（〃） */

function render(now){
  /* --- 日付と曜日 --- */
  const w = WEEK[now.getDay()];
  $("dateText").textContent = now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日";
  $("youbiText").textContent = "（" + w.name + "）";
  $("youbiIcon").textContent = w.icon;

  /* --- 時刻（12時間表示・設計書どおり 08:59 形式） --- */
  const h24 = now.getHours();
  $("ampm").textContent = h24 < 12 ? "午前" : "午後";
  $("hh").textContent = pad(h24 % 12 === 0 ? 12 : h24 % 12);
  $("mm").textContent = pad(now.getMinutes());

  /* --- 予定：17時までは今日、17時からは明日 --- */
  const isTomorrow = h24 >= SWITCH_HOUR;
  const target = new Date(now);
  if (isTomorrow) target.setDate(target.getDate() + 1);
  const plan = planFor(target);
  const has = plan !== NO_PLAN;
  currentTarget = target;
  currentPlanName = plan;

  const label = $("planLabel");
  label.textContent = isTomorrow ? "明日は…" : "本日は…";
  label.classList.toggle("tomorrow", isTomorrow);

  const main = $("planMain");
  main.textContent = has ? plan + "の日 です" : "予定は ありません";
  main.className = "plan-main " + (has ? "has-plan" : "no-plan");

  /* 明日表示のときだけ「本日の○○は終了しました」を小さくつける。
     ただし本日の予定が「予定なし」なら省略（空文字） */
  let sub = "";
  if (isTomorrow) {
    const todayPlan = planFor(now);
    if (todayPlan !== NO_PLAN) sub = "（本日の" + todayPlan + "の日は終了しました）";
  }
  $("planSub").textContent = sub;

  lastDayKey = now.getFullYear() + "-" + now.getMonth() + "-" + now.getDate();
}

/* 軽量設計：5秒に1回だけ目覚めて、「分」が変わった時だけ画面を書き換える。
   毎フレーム処理・requestAnimationFrame は使わない。 */
function tick(){
  const now = new Date();
  const key = now.getHours() + ":" + now.getMinutes();
  if (key !== lastMinuteKey) { lastMinuteKey = key; render(now); }
}
tick();
setInterval(tick, 5000);

/* 画面が裏に回っている間はタイマー自体が間引かれるので、戻ってきたら即再描画 */
document.addEventListener("visibilitychange", () => { if (!document.hidden) { lastMinuteKey=""; tick(); } });

/* ---------- 全画面ボタン ---------- */
$("btnFull").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else document.documentElement.requestFullscreen().catch(()=>{});
});
document.addEventListener("fullscreenchange", () => {
  $("btnFull").textContent = document.fullscreenElement ? "⛶ もどす" : "⛶ 全画面";
});

/* ---------- 画面をつけたままにする（対応ブラウザのみ・失敗しても無視） ---------- */
let wakeLock = null;
async function keepAwake(){
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch(e) {}
}
if ("wakeLock" in navigator) {
  keepAwake();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
}

/* ---------- カレンダー（開いた時だけ描く＝常時はゼロコスト） ---------- */
function buildCalendar(base){
  const y = base.getFullYear(), m = base.getMonth();
  $("calTitle").textContent = y + "年" + (m+1) + "月のカレンダー";
  const first = new Date(y, m, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrev = new Date(y, m, 0).getDate();
  const today = new Date();
  let html = "<table class='cal'><tr>";
  ["日","月","火","水","木","金","土"].forEach((d,i)=>{
    html += "<th class='" + (i===0?"sun":i===6?"sat":"") + "'>" + d + "</th>";
  });
  html += "</tr><tr>";
  let cell = 0;
  for (let i = 0; i < startDay; i++, cell++){
    const pd = daysInPrev - startDay + 1 + i;
    const pcls = isOffDay(new Date(y, m-1, pd)) ? "dim off" : "dim";
    html += "<td class='" + pcls + "'>" + pd + "</td>";
  }
  for (let d = 1; d <= daysInMonth; d++, cell++){
    if (cell % 7 === 0 && d > 1) html += "</tr><tr>";
    const dt = new Date(y, m, d);
    const cls = [];
    if (dt.getFullYear()===today.getFullYear() && dt.getMonth()===today.getMonth() && dt.getDate()===today.getDate()) cls.push("today");
    else if (isOffDay(dt)) cls.push("off");
    if (planFor(dt) !== NO_PLAN) cls.push("has-plan");
    html += "<td class='" + cls.join(" ") + "'>" + d + "</td>";
  }
  while (cell % 7 !== 0) {
    const nd = cell - startDay - daysInMonth + 1;
    const ncls = isOffDay(new Date(y, m+1, nd)) ? "dim off" : "dim";
    html += "<td class='" + ncls + "'>" + nd + "</td>"; cell++;
  }
  html += "</tr></table>";
  $("calBody").innerHTML = html;
}
$("btnCal").addEventListener("click", () => { buildCalendar(new Date()); $("drawer").classList.add("open"); });
$("btnCloseCal").addEventListener("click", () => $("drawer").classList.remove("open"));

/* ---------- 小さなお知らせ（トースト） ---------- */
let toastTimer = null;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}

/* ---------- 予定の長押し編集 ---------- */
let pressTimer = null;
const planEl = $("planMain");
function openEditor(){
  if (!currentTarget) return;
  const t = currentTarget;
  $("editDate").textContent =
    t.getFullYear() + "年" + (t.getMonth()+1) + "月" + t.getDate() + "日（" + WEEK[t.getDay()].name + "）の予定" +
    " ／「毎週」は " + WEEK[t.getDay()].name + "曜日ぜんぶ";
  $("editInput").value = currentPlanName === NO_PLAN ? "" : currentPlanName;
  $("editBack").classList.add("open");
  if (navigator.vibrate) navigator.vibrate(30);
  setTimeout(() => { try { $("editInput").focus(); $("editInput").select(); } catch(e) {} }, 60);
}
function closeEditor(){ $("editBack").classList.remove("open"); }
function editedValue(){
  const v = $("editInput").value.trim();
  return v === "" ? NO_PLAN : v;
}
function applyEdit(){
  lastMinuteKey = ""; tick();               /* すぐ画面に反映 */
  if ($("drawer").classList.contains("open")) buildCalendar(new Date());
}
planEl.addEventListener("pointerdown", () => {
  planEl.classList.add("pressing");
  pressTimer = setTimeout(openEditor, 650); /* 0.65秒長押しで編集を開く */
});
["pointerup","pointerleave","pointercancel"].forEach(ev =>
  planEl.addEventListener(ev, () => { planEl.classList.remove("pressing"); clearTimeout(pressTimer); }));
planEl.addEventListener("contextmenu", e => e.preventDefault());

$("btnSaveDate").addEventListener("click", () => {
  if (!currentTarget) return;
  DATE_OVERRIDES[dateKey(currentTarget)] = editedValue();
  saveJSON("elderCal_dateOverrides", DATE_OVERRIDES);
  closeEditor(); applyEdit(); toast("この日の予定を変更しました");
});
$("btnSaveWeek").addEventListener("click", () => {
  if (!currentTarget) return;
  WEEK_OVERRIDES[String(currentTarget.getDay())] = editedValue();
  saveJSON("elderCal_weekOverrides", WEEK_OVERRIDES);
  closeEditor(); applyEdit(); toast("毎週" + WEEK[currentTarget.getDay()].name + "曜日の予定を変更しました");
});
$("btnNoPlan").addEventListener("click", () => {
  if (!currentTarget) return;
  DATE_OVERRIDES[dateKey(currentTarget)] = NO_PLAN;
  saveJSON("elderCal_dateOverrides", DATE_OVERRIDES);
  closeEditor(); applyEdit(); toast("この日は予定なしにしました");
});
$("btnCancelEdit").addEventListener("click", closeEditor);
$("editBack").addEventListener("click", e => { if (e.target === $("editBack")) closeEditor(); });

/* ============================================================
   MascotFeature（キャラ機能：独立ブロック）
   - タップ：小さく跳ねて、ひとこと吹き出しを出す
   - 長押し：大きさを循環する
   - サイズ段階は 2026-10-30 に再基準化：
     旧「中」→新「小」、旧「大」→新「中」、旧「特大」→新「大」、
     旧「超特大」→新「特大」。その上に新「超特大」「超超特大」を追加。
   - 外し方：このブロックと、HTMLの .mascot-bubble、CSSの
     .mascot-bubble / .mascot.reacting を消せば、キャラは静止表示に戻る。
   ============================================================ */
const MascotFeature = (() => {
  const SIZES = [
    { name:"小",     width:"clamp(120px,24vh,215px)" },  /* 旧「中」 */
    { name:"中",     width:"clamp(150px,32vh,285px)" },  /* 旧「大」 */
    { name:"大",     width:"clamp(185px,42vh,375px)" },  /* 旧「特大」 */
    { name:"特大",   width:"clamp(230px,52vh,470px)" },  /* 旧「超特大」 */
    { name:"超特大", width:"clamp(275px,62vh,565px)" },  /* 新規 */
    { name:"超超特大", width:"clamp(320px,72vh,660px)" } /* 新規 */
  ];
  const DEFAULT_INDEX = 2;              /* 既定は新「大」＝旧「特大」の実寸 */
  const OLD_TO_NEW = [0, 0, 1, 2, 3];   /* 旧index→新index（旧「小」は新「小」に丸める） */
  const KEY_V2 = "elderCal_mascotSizeV2";
  const KEY_V1 = "elderCal_mascotSize";
  const el = document.getElementById("mascot");
  const bubble = document.getElementById("mascotBubble");
  if (!el) return { enabled:false };

  let index = DEFAULT_INDEX;
  try {
    const v2 = parseInt(localStorage.getItem(KEY_V2) || "", 10);
    const v1 = parseInt(localStorage.getItem(KEY_V1) || "", 10);
    if (Number.isInteger(v2) && v2 >= 0 && v2 < SIZES.length) index = v2;
    else if (Number.isInteger(v1) && v1 >= 0 && v1 < OLD_TO_NEW.length) index = OLD_TO_NEW[v1];
  } catch(e) {}

  let bubbleTimer = null;
  let pressTimer = null;
  let longPressed = false;
  let pressStart = 0;

  function save(){
    try { localStorage.setItem(KEY_V2, String(index)); } catch(e) {}
  }
  function applySize(){
    el.style.width = SIZES[index].width;
  }
  function cycleSize(){
    index = (index + 1) % SIZES.length;
    applySize(); save();
    toast("キャラクターの大きさ：" + SIZES[index].name);
  }
  function message(){
    const h = new Date().getHours();
    const common = ["ぴょん！", "こんにちは", "みてるよ", "きょうも げんき"];
    if (h < 11) common.push("おはよう");
    else if (h >= 17) common.push("こんばんは");
    return common[Math.floor(Math.random() * common.length)];
  }
  function react(){
    el.classList.remove("reacting");
    void el.offsetWidth; /* アニメーションを最初から再生させる */
    el.classList.add("reacting");
    if (bubble) {
      bubble.textContent = message();
      bubble.classList.add("show");
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 1600);
    }
    setTimeout(() => el.classList.remove("reacting"), 700);
  }
  function startPress(){
    longPressed = false;
    pressStart = Date.now();
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => { longPressed = true; cycleSize(); }, 750);
  }
  function endPress(){
    clearTimeout(pressTimer);
  }

  applySize();
  el.addEventListener("pointerdown", startPress);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => el.addEventListener(ev, endPress));
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("dragstart", e => e.preventDefault());
  el.addEventListener("click", () => {
    if (longPressed) { longPressed = false; return; } /* 長押しはサイズ変更だけ */
    const held = pressStart ? Date.now() - pressStart : 0;
    if (held >= 650) { cycleSize(); return; } /* タイマーが奪われた場合の保険：押下時間でも判定 */
    react();
  });

  return { enabled:true, sizes:SIZES, applySize, cycleSize, react };
})();
</script>
