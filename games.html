<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>どの ゲームで あそぶ？</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:#fdf6e3; color:#33302a; height:100dvh;
    display:flex; flex-direction:column; align-items:center; padding:14px 16px 16px;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  h1{
    font-size:clamp(28px, 5vw, 44px); color:#7a4a12; text-align:center; line-height:1.4; margin-top:0;
  }
  /* 2カラム×4行で画面の高さにぴったり収める（スクロールさせない・7ボタン対応） */
  .games{ display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:minmax(0, 1fr); gap:12px;
    margin-top:10px; width:min(94vw, 880px); flex:1; min-height:0; }
  a.gamebtn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    text-decoration:none; text-align:center; min-height:0; overflow:hidden;
    background:#fff; border:5px solid #f0b429; border-radius:26px; padding:8px 12px;
    box-shadow:0 8px 0 rgba(140,90,20,0.35);
  }
  a.gamebtn:active{ transform:translateY(4px); box-shadow:0 3px 0 rgba(140,90,20,0.35); }
  a.gamebtn .emo{ font-size:clamp(36px, 7vh, 52px); line-height:1; }
  a.gamebtn .tx .t{ font-size:clamp(22px, 3vw, 30px); font-weight:bold; color:#4c3d20; line-height:1.35; }
  a.gamebtn .tx .d{ font-size:clamp(14px, 2vw, 18px); font-weight:bold; color:#97835e; margin-top:3px; line-height:1.35; }
  /* スマホ等の細い画面では1カラムに戻してスクロール可にする */
  @media (max-width:600px){
    body{ height:auto; min-height:100dvh; }
    .games{ grid-template-columns:1fr; grid-template-rows:none; flex:none; }
  }
  a.backbtn{
    margin-top:14px; display:inline-block; text-decoration:none;
    font-size:clamp(22px, 4vw, 30px); font-weight:bold; color:#20506e;
    background:#dceefb; border:4px solid #7db3dd; border-radius:999px; padding:12px 30px;
    box-shadow:0 5px 0 rgba(40,90,130,0.35);
  }
  a.backbtn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(40,90,130,0.35); }
  #fsBtn{
    position:fixed; top:10px; right:10px; z-index:10; cursor:pointer;
    font-family:inherit; font-size:19px; font-weight:bold; color:#6b4d14;
    background:#fff8ea; border:3px solid #b08d4f; border-radius:999px; padding:10px 20px;
    box-shadow:0 3px 0 rgba(90,60,20,0.35);
  }
</style>
</head>
<body>
<button id="fsBtn">⛶ ぜんがめん</button>
<h1>どの ゲームで あそぶ？</h1>
<div class="games">
  <a class="gamebtn" href="slot.html">
    <span class="emo">🎰</span>
    <span class="tx"><span class="t">ナビちゃん スロット</span><span class="d" style="display:block;">ボタンを おすだけ！ コインが ふえるよ</span></span>
  </a>
  <a class="gamebtn" href="quiz.html">
    <span class="emo">🖼️</span>
    <span class="tx"><span class="t">えあてクイズ</span><span class="d" style="display:block;">おしたら すぐ はじまる！ 絵を あてる クイズ</span></span>
  </a>
  <a class="gamebtn" href="sakana_kanji.html">
    <span class="emo">🐟</span>
    <span class="tx"><span class="t">さかな漢字クイズ</span><span class="d" style="display:block;">魚へんの かんじクイズ</span></span>
  </a>
  <a class="gamebtn" href="hana.html">
    <span class="emo">🌸</span>
    <span class="tx"><span class="t">おはなばたけ</span><span class="d" style="display:block;">タップすると おはなが さくよ</span></span>
  </a>
  <a class="gamebtn" href="suisou.html">
    <span class="emo">🐠</span>
    <span class="tx"><span class="t">すいぞくかん</span><span class="d" style="display:block;">ごはんを あげよう 🐠</span></span>
  </a>
  <a class="gamebtn" href="machigai.html">
    <span class="emo">🔍</span>
    <span class="tx"><span class="t">まちがいさがし</span><span class="d" style="display:block;">3まいクリアで おわり！</span></span>
  </a>
  <a class="gamebtn" href="sansuu.html">
    <span class="emo">🔢</span>
    <span class="tx"><span class="t">さんすうクイズ</span><span class="d" style="display:block;">かぞえる・たし算・ひき算の クイズ</span></span>
  </a>
</div>
<a class="backbtn" href="index.html">🕐 とけいに もどる</a>
<script>
"use strict";
/* 全画面：ボタンで切り替え＋最初のタップで自動的に全画面（スロットと同じ方式） */
const fsBtn = document.getElementById("fsBtn");
function syncFsLabel(){ fsBtn.textContent = document.fullscreenElement ? "⛶ もどす" : "⛶ ぜんがめん"; }
fsBtn.addEventListener("click", ()=>{
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else document.documentElement.requestFullscreen().catch(()=>{});
});
document.addEventListener("fullscreenchange", syncFsLabel);
/* 全画面はボタンで手動のみ（2026-11-10 本人指示：初回タップ自動全画面は廃止） */
</script>

<!-- 埋め込み（時計の窓の中）対応: 見た目はそのまま、戻るリンクの挙動だけ合図に変える -->
<style>html.embedded #fsBtn{ display:none !important; }</style>
<script>
if (window.self !== window.top) {
  document.documentElement.classList.add("embedded");
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href="index.html"]');
    if (a) { e.preventDefault(); parent.postMessage("closeGame", "*"); }
  });
}
</script>
</body>
</html>
